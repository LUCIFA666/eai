env:
  train:
    env_type: maniskill
    total_num_envs: 32
    auto_reset: true
    ignore_terminations: true
    use_rel_reward: true
    seed: 0
    group_size: 1
    use_fixed_reset_state_ids: false
    max_steps_per_rollout_epoch: 80
    max_episode_steps: 80
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: /data/rbc/hands-on-embodied-ai/runs/rlinf_quickstart/video/train
    enable_offload: true
    init_params:
      id: PutCarrotOnPlateInScene-v2
      num_envs: null
      obs_mode: rgb+segmentation
      control_mode: arm_pd_ee_target_delta_pose_align2_gripper_pd_joint_pos
      sim_backend: gpu
      sim_config:
        sim_freq: 500
        control_freq: 5
      max_episode_steps: 80
      sensor_configs:
        shader_pack: default
      render_mode: all
  eval:
    env_type: maniskill
    total_num_envs: 32
    auto_reset: true
    ignore_terminations: true
    use_rel_reward: true
    seed: 0
    group_size: 1
    use_fixed_reset_state_ids: true
    max_steps_per_rollout_epoch: 80
    max_episode_steps: 80
    video_cfg:
      save_video: true
      info_on_video: true
      video_base_dir: /data/rbc/hands-on-embodied-ai/runs/rlinf_quickstart/video/eval
    enable_offload: true
    init_params:
      id: PutCarrotOnPlateInScene-v2
      num_envs: null
      obs_mode: rgb+segmentation
      control_mode: arm_pd_ee_target_delta_pose_align2_gripper_pd_joint_pos
      sim_backend: gpu
      sim_config:
        sim_freq: 500
        control_freq: 5
      max_episode_steps: 80
      sensor_configs:
        shader_pack: default
      render_mode: all
  group_name: EnvGroup
actor:
  model:
    model_type: openvla
    model_path: /data/rbc/Embodied_models/openvla-7b-rlvla-warmup
    precision: bf16
    action_dim: 7
    num_action_chunks: 1
    use_proprio: false
    unnorm_key: bridge_orig
    center_crop: true
    add_bias_linear: false
    add_qkv_bias: true
    vocab_size: 32000
    hidden_size: 4096
    policy_setup: widowx_bridge
    add_value_head: true
    image_size:
    - 224
    - 224
    max_prompt_length: 30
    is_lora: true
    lora_rank: 32
    attn_implementation: sdpa
    low_cpu_mem_usage: true
    trust_remote_code: true
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: bf16
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
      init_scale: null
      growth_interval: null
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 20
  global_batch_size: 160
  seed: 1234
  enable_offload: true
  optim:
    lr: 0.0001
    value_lr: 0.003
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-1
runner:
  task_type: embodied
  logger:
    log_path: /data/rbc/hands-on-embodied-ai/runs/rlinf_quickstart
    project_name: rlinf
    experiment_name: maniskill_ppo_openvla_local
    logger_backends:
    - tensorboard
  max_epochs: 5
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 40
  resume_dir: null
  ckpt_path: null
  per_worker_log: false
  per_worker_log_path: null
  nsight_output_path: null
  weight_sync_interval: 1
  overlap_env_bootstrap: false
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  rollout_epoch: 1
  eval_rollout_epoch: 1
  reward_type: action_level
  logprob_type: action_level
  entropy_type: action_level
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  bootstrap_type: always
  kl_beta: 0.0
  ratio_clip_eps: 0.2
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
  length_params:
    max_new_token: 7
    max_length: 1024
    min_length: 1
rollout:
  group_name: RolloutGroup
  backend: huggingface
  gpu_memory_utilization: 0.5
  enforce_eager: true
  enable_offload: true
  pipeline_stage_num: 2
  model:
    model_path: /data/rbc/Embodied_models/openvla-7b-rlvla-warmup
    precision: bf16
reward:
  use_reward_model: false
critic:
  use_critic_model: false
