<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">LeWorldModel reproduction verification summary</title>
  <desc id="desc">Six successful verification checks from environment setup through training and MPC.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a35"/>
      <stop offset="1" stop-color="#162a5c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <text x="56" y="65" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">LeWM reproduction checks</text>
  <text x="56" y="99" fill="#a8c9ff" font-family="Inter,Arial,sans-serif" font-size="18">Official Push-T checkpoint · A100 GPU · strict verification</text>

  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(56 135)">
      <rect width="336" height="102" rx="17" fill="#ffffff"/>
      <circle cx="38" cy="37" r="18" fill="#16a66a"/><path d="M29 37l6 6 12-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="34" fill="#12213d" font-size="19" font-weight="700">Environment</text>
      <text x="70" y="61" fill="#53627a" font-size="16">Python 3.10 · CUDA visible</text>
      <text x="70" y="84" fill="#53627a" font-size="16">Transformers 4.57.6</text>
    </g>
    <g transform="translate(432 135)">
      <rect width="336" height="102" rx="17" fill="#ffffff"/>
      <circle cx="38" cy="37" r="18" fill="#16a66a"/><path d="M29 37l6 6 12-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="34" fill="#12213d" font-size="19" font-weight="700">Strict checkpoint load</text>
      <text x="70" y="61" fill="#53627a" font-size="16">18,034,478 parameters</text>
      <text x="70" y="84" fill="#53627a" font-size="16">All state_dict keys matched</text>
    </g>
    <g transform="translate(808 135)">
      <rect width="336" height="102" rx="17" fill="#ffffff"/>
      <circle cx="38" cy="37" r="18" fill="#16a66a"/><path d="M29 37l6 6 12-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="34" fill="#12213d" font-size="19" font-weight="700">Forward + losses</text>
      <text x="70" y="61" fill="#53627a" font-size="16">Embedding and prediction finite</text>
      <text x="70" y="84" fill="#53627a" font-size="16">MSE + SIGReg verified</text>
    </g>
    <g transform="translate(56 270)">
      <rect width="336" height="102" rx="17" fill="#ffffff"/>
      <circle cx="38" cy="37" r="18" fill="#16a66a"/><path d="M29 37l6 6 12-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="34" fill="#12213d" font-size="19" font-weight="700">Two loader APIs</text>
      <text x="70" y="61" fill="#53627a" font-size="16">load_pretrained</text>
      <text x="70" y="84" fill="#53627a" font-size="16">AutoCostModel</text>
    </g>
    <g transform="translate(432 270)">
      <rect width="336" height="102" rx="17" fill="#ffffff"/>
      <circle cx="38" cy="37" r="18" fill="#16a66a"/><path d="M29 37l6 6 12-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="34" fill="#12213d" font-size="19" font-weight="700">MPC cost path</text>
      <text x="70" y="61" fill="#53627a" font-size="16">Two candidates evaluated</text>
      <text x="70" y="84" fill="#53627a" font-size="16">Finite cost returned</text>
    </g>
    <g transform="translate(808 270)">
      <rect width="336" height="102" rx="17" fill="#ffffff"/>
      <circle cx="38" cy="37" r="18" fill="#16a66a"/><path d="M29 37l6 6 12-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="34" fill="#12213d" font-size="19" font-weight="700">Backward + save</text>
      <text x="70" y="61" fill="#53627a" font-size="16">297 tensors received gradients</text>
      <text x="70" y="84" fill="#53627a" font-size="16">Checkpoint loaded back</text>
