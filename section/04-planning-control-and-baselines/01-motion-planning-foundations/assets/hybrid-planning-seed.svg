<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc"><title id="title">采样规划为轨迹优化提供种子</title><desc id="desc">采样规划器先跨越拓扑障碍找到可行路径，轨迹优化器再改善平滑性、余量和约束，时间参数化随后生成可执行轨迹。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#247d67"/></marker></defs><rect width="1080" height="500" rx="30" fill="#f5f9f7"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="540" y="48" font-size="27" font-weight="700" fill="#17251f">工程里常见的强组合：先跨过拓扑难题，再优化质量</text><g stroke-width="2"><rect x="45" y="105" width="210" height="260" rx="22" fill="#eef2ff" stroke="#9dadde"/><rect x="320" y="105" width="210" height="260" rx="22" fill="#fff5e7" stroke="#dfb36b"/><rect x="595" y="105" width="210" height="260" rx="22" fill="#e4f5ef" stroke="#78b8a2"/><rect x="870" y="105" width="165" height="260" rx="22" fill="#f4edfa" stroke="#b7a0d0"/></g><g font-size="19" font-weight="700"><text x="150" y="145">场景与请求</text><text x="425" y="145">采样式规划</text><text x="700" y="145">轨迹优化</text><text x="952" y="145">时间化</text></g><g font-size="14" fill="#4c625a"><text x="150" y="182">q_start / goal</text><text x="150" y="208">障碍 / 限位 / 约束</text><text x="150" y="248">问题：是否存在通路？</text><text x="425" y="182">RRT-Connect / PRM</text><text x="425" y="208">绕到障碍另一侧</text><text x="425" y="248">产出：可行但可能折线</text><text x="700" y="182">CHOMP / STOMP</text><text x="700" y="208">TrajOpt / cuRobo</text><text x="700" y="248">产出：平滑、有余量</text><text x="952" y="182">TOTG</text><text x="952" y="208">Ruckig</text><text x="952" y="248">产出：t, q, q̇, q̈</text></g><g stroke="#247d67" stroke-width="3" marker-end="url(#a)"><path d="M255 235H312"/><path d="M530 235H587"/><path d="M805 235H862"/></g><rect x="110" y="405" width="860" height="55" rx="17" fill="#fff" stroke="#c9d8d2"/><text x="540" y="438" font-size="15" fill="#4c625a">任何阶段失败都应保留独立错误码：无通路、seed 不佳、约束冲突、时间化失败不是同一种问题。</text></g></svg>
