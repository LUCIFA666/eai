<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 540" role="img" aria-labelledby="title desc"><title id="title">碰撞检测的分层查询管线</title><desc id="desc">候选机器人状态先更新连杆位姿，再经过宽阶段筛选、窄阶段精确查询并汇总碰撞、距离、接触和梯度结果。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#247d67"/></marker></defs><rect width="1060" height="540" rx="30" fill="#f5f9f7"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="530" y="48" font-size="27" font-weight="700" fill="#17251f">一次碰撞查询，通常先排除“肯定不碰”的对象</text><g stroke-width="2"><rect x="54" y="105" width="190" height="142" rx="22" fill="#eef2ff" stroke="#9dadde"/><rect x="288" y="105" width="190" height="142" rx="22" fill="#fff5e7" stroke="#dfb36b"/><rect x="522" y="105" width="190" height="142" rx="22" fill="#e4f5ef" stroke="#78b8a2"/><rect x="756" y="105" width="250" height="142" rx="22" fill="#f4edfa" stroke="#b7a0d0"/></g><text x="149" y="145" font-size="19" font-weight="700">状态展开</text><text x="383" y="145" font-size="19" font-weight="700">宽阶段</text><text x="617" y="145" font-size="19" font-weight="700">窄阶段</text><text x="881" y="145" font-size="19" font-weight="700">结果与策略</text><g font-size="14" fill="#4c625a"><text x="149" y="178">FK 更新 link pose</text><text x="149" y="203">附着物随末端移动</text><text x="383" y="178">AABB / BVH / tree</text><text x="383" y="203">生成少量候选 pair</text><text x="617" y="178">primitive / mesh</text><text x="617" y="203">GJK、三角形或 SDF</text><text x="881" y="171">collision? · min distance</text><text x="881" y="195">contact · normal · gradient</text><text x="881" y="219">拒绝 / 加代价 / 触发停止</text></g><g stroke="#247d67" stroke-width="3" marker-end="url(#a)"><path d="M244 176H280"/><path d="M478 176H514"/><path d="M712 176H748"/></g>
<rect x="90" y="315" width="880" height="150" rx="24" fill="#fff" stroke="#c9d8d2"/><text x="530" y="350" font-size="19" font-weight="700" fill="#247d67">三类经常被混淆的查询</text><g font-size="15"><text x="250" y="389" font-weight="700">离散状态检查</text><text x="250" y="418" fill="#4c625a">qₖ 是否碰撞？</text><text x="530" y="389" font-weight="700">离散路径检查</text><text x="530" y="418" fill="#4c625a">对边插值多个 q 再检查</text><text x="810" y="389" font-weight="700">连续碰撞检查</text><text x="810" y="418" fill="#4c625a">运动过程中是否首次接触？</text></g></g></svg>
