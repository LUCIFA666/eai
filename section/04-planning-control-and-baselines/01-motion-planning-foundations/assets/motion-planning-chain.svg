<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">从场景到机器人执行的运动规划链路</title><desc id="desc">环境与机器人模型经过碰撞查询、路径搜索、轨迹优化和时间参数化，最终交给控制器执行。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#247d67"/></marker></defs>
  <rect width="1120" height="500" rx="30" fill="#f5f9f7"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle">
    <text x="560" y="48" font-size="27" font-weight="700" fill="#17251f">一次可执行运动，不是一个规划器单独完成的</text>
    <g stroke-width="2"><rect x="48" y="105" width="190" height="150" rx="22" fill="#eef2ff" stroke="#9dadde"/><rect x="266" y="105" width="190" height="150" rx="22" fill="#fff5e7" stroke="#dfb36b"/><rect x="484" y="105" width="190" height="150" rx="22" fill="#e4f5ef" stroke="#78b8a2"/><rect x="702" y="105" width="190" height="150" rx="22" fill="#f4edfa" stroke="#b7a0d0"/><rect x="920" y="105" width="152" height="150" rx="22" fill="#eaf3f8" stroke="#8cb4c9"/></g>
    <g fill="#17251f"><text x="143" y="146" font-size="20" font-weight="700">表示与碰撞</text><text x="361" y="146" font-size="20" font-weight="700">路径搜索</text><text x="579" y="146" font-size="20" font-weight="700">轨迹优化</text><text x="797" y="146" font-size="20" font-weight="700">时间参数化</text><text x="996" y="146" font-size="20" font-weight="700">控制执行</text></g>
    <g font-size="15" fill="#4c625a"><text x="143" y="180">机器人 · 障碍物</text><text x="143" y="207">距离 · 接触 · 余量</text><text x="361" y="180">PRM · RRT</text><text x="361" y="207">先找到可行路径</text><text x="579" y="180">平滑 · 避障</text><text x="579" y="207">约束与代价</text><text x="797" y="180">速度 · 加速度</text><text x="797" y="207">jerk · 时间戳</text><text x="996" y="180">跟踪 · 反馈</text><text x="996" y="207">监测 · 急停</text></g>
    <g stroke="#247d67" stroke-width="3" marker-end="url(#arrow)"><path d="M238 180H258"/><path d="M456 180H476"/><path d="M674 180H694"/><path d="M892 180H912"/></g>
    <rect x="80" y="316" width="960" height="105" rx="22" fill="#ffffff" stroke="#c9d8d2"/><text x="560" y="350" font-size="18" font-weight="700" fill="#247d67">贯穿全链路的共同合同</text><text x="560" y="382" font-size="16" fill="#42554e">坐标系与单位一致 · 当前状态有时间戳 · 限位可信 · 场景及时更新 · 每一步都有可验证输出</text>
  </g>
</svg>
