<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc"><title id="title">端点安全不代表路径安全</title><desc id="desc">粗离散只检查两个安全端点时会漏掉中间障碍，加密采样或连续碰撞检测能够发现穿越。</desc><rect width="1040" height="470" rx="30" fill="#f5f9f7"/><g font-family="Arial,'Microsoft YaHei',sans-serif"><text x="520" y="47" text-anchor="middle" font-size="27" font-weight="700" fill="#17251f">端点都安全，中间仍可能穿过障碍物</text><g transform="translate(45,85)"><rect width="450" height="300" rx="22" fill="#fff" stroke="#c9d8d2"/><text x="225" y="38" text-anchor="middle" font-size="19" font-weight="700">只检查两个 waypoint：误判安全</text><rect x="194" y="92" width="64" height="128" rx="10" fill="#ef8354"/><path d="M70 156H380" stroke="#247d67" stroke-width="6" stroke-linecap="round"/><circle cx="70" cy="156" r="15" fill="#247ba0"/><circle cx="380" cy="156" r="15" fill="#f4b942"/><text x="70" y="192" text-anchor="middle" font-size="14">q₀ ✓</text><text x="380" y="192" text-anchor="middle" font-size="14">q₁ ✓</text><text x="225" y="260" text-anchor="middle" font-size="15" fill="#a34424">中间没有被检查</text></g><g transform="translate(545,85)"><rect width="450" height="300" rx="22" fill="#fff" stroke="#c9d8d2"/><text x="225" y="38" text-anchor="middle" font-size="19" font-weight="700">加密采样 / 连续检测：发现穿越</text><rect x="194" y="92" width="64" height="128" rx="10" fill="#ef8354"/><path d="M70 156H380" stroke="#247d67" stroke-width="4" stroke-dasharray="7 7"/><g fill="#247ba0"><circle cx="70" cy="156" r="11"/><circle cx="115" cy="156" r="9"/><circle cx="160" cy="156" r="9"/></g><g fill="#c43f2d"><circle cx="205" cy="156" r="11"/><circle cx="250" cy="156" r="11"/></g><g fill="#f4b942"><circle cx="295" cy="156" r="9"/><circle cx="340" cy="156" r="9"/><circle cx="380" cy="156" r="11"/></g><text x="225" y="260" text-anchor="middle" font-size="15" fill="#a34424">碰撞样本 ✕</text></g></g></svg>
