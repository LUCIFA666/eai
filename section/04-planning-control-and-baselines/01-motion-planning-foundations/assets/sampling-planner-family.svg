<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 560" role="img" aria-labelledby="title desc"><title id="title">PRM、RRT、RRT星和Informed RRT星的差异</title><desc id="desc">PRM预先构建可复用路网，RRT快速探索单次查询，RRT星重连改善路径，Informed RRT星在已有解后聚焦可改进区域。</desc><rect width="1110" height="560" rx="30" fill="#f5f9f7"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="555" y="48" font-size="27" font-weight="700" fill="#17251f">四个名字背后，是四种不同的“把计算花在哪里”</text><g stroke-width="2"><rect x="35" y="92" width="250" height="385" rx="22" fill="#eef2ff" stroke="#9dadde"/><rect x="298" y="92" width="250" height="385" rx="22" fill="#fff5e7" stroke="#dfb36b"/><rect x="561" y="92" width="250" height="385" rx="22" fill="#e4f5ef" stroke="#78b8a2"/><rect x="824" y="92" width="250" height="385" rx="22" fill="#f4edfa" stroke="#b7a0d0"/></g><g font-size="21" font-weight="700"><text x="160" y="132">PRM</text><text x="423" y="132">RRT / RRT-Connect</text><text x="686" y="132">RRT*</text><text x="949" y="132">Informed RRT*</text></g><g transform="translate(55,158)" stroke="#718d86" stroke-width="1.6"><path d="M20 180L65 80L108 190L165 55L210 155M20 180L108 190M65 80L165 55M108 190L210 155M65 80L210 155"/><g fill="#247d67" stroke="none"><circle cx="20" cy="180" r="6"/><circle cx="65" cy="80" r="6"/><circle cx="108" cy="190" r="6"/><circle cx="165" cy="55" r="6"/><circle cx="210" cy="155" r="6"/></g></g><g transform="translate(318,158)" fill="none" stroke="#247d67" stroke-width="2"><path d="M22 182L72 143L94 92M72 143L145 157L190 110M94 92L135 55M145 157L214 180M190 110L220 72"/></g><g transform="translate(581,158)" fill="none" stroke="#247d67" stroke-width="2"><path d="M22 182L78 140L135 110L205 64M78 140L120 170M135 110L176 146M135 110L102 62"/><path d="M22 182C90 173 144 130 205 64" stroke="#ef8354" stroke-width="5"/></g><g transform="translate(844,158)"><ellipse cx="112" cy="120" rx="100" ry="52" transform="rotate(-28 112 120)" fill="#b7a0d0" opacity=".22" stroke="#75549a" stroke-width="2"/><path d="M22 182C80 150 137 105 205 64" fill="none" stroke="#247d67" stroke-width="5"/><circle cx="22" cy="182" r="7" fill="#247ba0"/><circle cx="205" cy="64" r="7" fill="#f4b942"/></g><g font-size="14" fill="#4c625a"><text x="160" y="390">多查询：路网可复用</text><text x="160" y="416">预处理成本较高</text><text x="423" y="390">单查询快速找可行解</text><text x="423" y="416">路径质量依赖后处理</text><text x="686" y="390">邻域重连、渐进最优</text><text x="686" y="416">需要更多时间</text><text x="949" y="390">有解后只采样可改进区</text><text x="949" y="416">依赖可用启发式</text></g></g></svg>
