<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 570" role="img" aria-labelledby="title desc"><title id="title">位置、速度、加速度和jerk曲线</title><desc id="desc">位置曲线的斜率是速度，速度斜率是加速度，加速度斜率是jerk，约束高阶导数能够减少机械冲击。</desc><rect width="1080" height="570" rx="30" fill="#f5f9f7"/><g font-family="Arial,'Microsoft YaHei',sans-serif"><text x="540" y="48" text-anchor="middle" font-size="27" font-weight="700" fill="#17251f">轨迹是否“顺滑”，要沿着导数一直看到 jerk</text><g transform="translate(80,92)"><g stroke="#c3d1cc" stroke-width="1"><path d="M0 90H900M0 200H900M0 310H900M0 420H900"/></g><g font-size="16" font-weight="700" fill="#17251f"><text x="0" y="25">position q</text><text x="0" y="145">velocity q̇</text><text x="0" y="255">acceleration q̈</text><text x="0" y="365">jerk q⃛</text></g><path d="M130 90C230 90 260 25 380 25H520C640 25 670 90 770 90" fill="none" stroke="#247ba0" stroke-width="4"/><path d="M130 200C200 200 220 145 300 145H600C680 145 700 200 770 200" fill="none" stroke="#247d67" stroke-width="4"/><path d="M130 310H220L280 260H620L680 310H770" fill="none" stroke="#ef8354" stroke-width="4"/><path d="M130 420H220V380H280V420H620V460H680V420H770" fill="none" stroke="#75549a" stroke-width="4"/><g font-size="14" fill="#4c625a"><text x="795" y="92">到达目标</text><text x="795" y="202">速度归零</text><text x="795" y="312">加速度受限</text><text x="795" y="422">变化仍可能突兀</text></g></g><rect x="155" y="522" width="770" height="32" rx="12" fill="#fff" stroke="#c9d8d2"/><text x="540" y="544" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" fill="#4c625a">TOTG 主要处理速度/加速度；Ruckig 可作为后处理限制 jerk，二者职责不要混称。</text></g></svg>
