<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc"><title id="title">轨迹优化中的变量、代价和约束</title><desc id="desc">离散路径点作为优化变量，平滑性、障碍距离、关节限位和任务目标共同形成代价与约束，经迭代更新得到局部最优轨迹。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#247d67"/></marker></defs><rect width="1100" height="570" rx="30" fill="#f5f9f7"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="550" y="48" font-size="27" font-weight="700" fill="#17251f">轨迹优化：移动整条路径，而不是只选择下一个节点</text><rect x="55" y="95" width="270" height="360" rx="22" fill="#fff" stroke="#c9d8d2" stroke-width="2"/><text x="190" y="132" font-size="19" font-weight="700">优化变量</text><path d="M88 352C130 310 142 198 202 218S252 158 292 120" fill="none" stroke="#7a8793" stroke-width="3" stroke-dasharray="7 7"/><g fill="#247d67"><circle cx="88" cy="352" r="8"/><circle cx="120" cy="320" r="7"/><circle cx="146" cy="260" r="7"/><circle cx="175" cy="218" r="7"/><circle cx="202" cy="218" r="7"/><circle cx="238" cy="205" r="7"/><circle cx="265" cy="160" r="7"/><circle cx="292" cy="120" r="8"/></g><text x="190" y="401" font-size="15" fill="#4c625a">Q = [q₀, q₁, …, qₙ]</text><path d="M325 275H372" stroke="#247d67" stroke-width="3" marker-end="url(#a)"/><rect x="380" y="82" width="340" height="390" rx="24" fill="#e4f5ef" stroke="#78b8a2" stroke-width="2"/><text x="550" y="122" font-size="20" font-weight="700">目标函数 + 约束</text><g text-anchor="start"><text x="425" y="170" font-size="17" font-weight="700">λₛ · 平滑性</text><text x="425" y="198" font-size="14" fill="#4c625a">速度 / 加速度 / 曲率有限</text><text x="425" y="242" font-size="17" font-weight="700">λₒ · 障碍代价</text><text x="425" y="270" font-size="14" fill="#4c625a">距离小于安全余量时惩罚</text><text x="425" y="314" font-size="17" font-weight="700">λg · 目标误差</text><text x="425" y="342" font-size="14" fill="#4c625a">末端 pose / 关节终点 / waypoint</text><text x="425" y="386" font-size="17" font-weight="700">硬约束</text><text x="425" y="414" font-size="14" fill="#4c625a">起终点、关节限位、接触条件</text></g><path d="M720 275H767" stroke="#247d67" stroke-width="3" marker-end="url(#a)"/><rect x="775" y="95" width="270" height="360" rx="22" fill="#fff5e7" stroke="#dfb36b" stroke-width="2"/><text x="910" y="132" font-size="19" font-weight="700">迭代后的轨迹</text><ellipse cx="908" cy="250" rx="52" ry="76" fill="#ef8354" opacity=".75"/><path d="M808 353C844 318 842 267 832 218C822 168 865 120 1010 112" fill="none" stroke="#247d67" stroke-width="5"/><text x="910" y="401" font-size="15" fill="#4c625a">可行、平滑，但通常只是</text><text x="910" y="426" font-size="15" fill="#4c625a">当前 seed 附近的局部最优</text><rect x="145" y="500" width="810" height="44" rx="15" fill="#fff" stroke="#c9d8d2"/><text x="550" y="528" font-size="15" fill="#4c625a">权重决定“更短、更平滑、更远离障碍”之间的取舍；它们不是越大越安全。</text></g></svg>
