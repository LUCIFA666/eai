<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc">
  <title id="title">运动规划常见环境与机器人表示</title><desc id="desc">原始传感器和CAD数据被转换为几何基元、网格和BVH、占据体素、距离场或碰撞球，服务于不同碰撞查询。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#247d67"/></marker></defs><rect width="1120" height="610" rx="30" fill="#f5f9f7"/>
  <g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="560" y="48" font-size="27" font-weight="700" fill="#17251f">同一个世界，可以为了不同查询保存成不同形状</text>
    <rect x="390" y="82" width="340" height="74" rx="18" fill="#fff" stroke="#b7cbc3" stroke-width="2"/><text x="560" y="113" font-size="19" font-weight="700">输入：CAD / URDF / 深度图 / 点云</text><text x="560" y="140" font-size="14" fill="#5b6e67">先统一 frame、单位、时间戳，再构建碰撞表示</text>
    <g stroke="#247d67" stroke-width="3" marker-end="url(#a)"><path d="M560 156V196"/><path d="M560 180H135V222"/><path d="M560 180H350V222"/><path d="M560 180H770V222"/><path d="M560 180H985V222"/></g>
    <g stroke-width="2"><rect x="35" y="222" width="200" height="230" rx="22" fill="#eef2ff" stroke="#9dadde"/><rect x="250" y="222" width="200" height="230" rx="22" fill="#fff5e7" stroke="#dfb36b"/><rect x="465" y="222" width="200" height="230" rx="22" fill="#e4f5ef" stroke="#78b8a2"/><rect x="680" y="222" width="200" height="230" rx="22" fill="#f4edfa" stroke="#b7a0d0"/><rect x="895" y="222" width="190" height="230" rx="22" fill="#eaf3f8" stroke="#8cb4c9"/></g>
    <g fill="#17251f" font-size="19" font-weight="700"><text x="135" y="260">几何基元</text><text x="350" y="260">网格 + BVH</text><text x="565" y="260">占据体素</text><text x="780" y="260">TSDF / ESDF</text><text x="990" y="260">碰撞球</text></g>
    <g font-size="14" fill="#4c625a"><text x="135" y="294">box · sphere</text><text x="135" y="318">capsule · cylinder</text><text x="135" y="354">查询快、参数清楚</text><text x="135" y="378">但近似可能保守</text><text x="350" y="294">三角网格保留细节</text><text x="350" y="318">BVH 跳过远处三角形</text><text x="350" y="354">适合 CAD / FCL</text><text x="350" y="378">更新与查询较重</text><text x="565" y="294">每格记录占据概率</text><text x="565" y="318">OctoMap 可稀疏存储</text><text x="565" y="354">适合未知环境</text><text x="565" y="378">分辨率决定细节</text><text x="780" y="294">每点可查询表面距离</text><text x="780" y="318">ESDF 适合规划代价</text><text x="780" y="354">支持梯度优化</text><text x="780" y="378">依赖传感与定位</text><text x="990" y="294">多球近似 link</text><text x="990" y="318">距离查询易并行</text><text x="990" y="354">cuRobo / RMPflow</text><text x="990" y="378">需检查覆盖质量</text></g>
    <rect x="105" y="492" width="910" height="76" rx="18" fill="#fff" stroke="#c9d8d2"/><text x="560" y="522" font-size="17" font-weight="700" fill="#247d67">选择原则：为查询服务，而不是追求“看起来最精细”</text><text x="560" y="549" font-size="15" fill="#4c625a">二值碰撞、最小距离、距离梯度、动态更新与 GPU 批量查询，对表示的要求并不相同。</text>
  </g>
</svg>
