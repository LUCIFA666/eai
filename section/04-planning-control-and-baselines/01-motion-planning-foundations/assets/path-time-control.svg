<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc"><title id="title">路径、时间轨迹与控制命令的区别</title><desc id="desc">几何路径只有顺序，时间参数化加入时间戳、速度和加速度，控制器再按控制周期消费并用反馈跟踪。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#247d67"/></marker></defs><rect width="1080" height="520" rx="30" fill="#f5f9f7"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="540" y="48" font-size="27" font-weight="700" fill="#17251f">“已经有路径”与“机器人可以执行”之间还隔着时间</text><g stroke-width="2"><rect x="55" y="95" width="260" height="300" rx="22" fill="#eef2ff" stroke="#9dadde"/><rect x="410" y="95" width="260" height="300" rx="22" fill="#e4f5ef" stroke="#78b8a2"/><rect x="765" y="95" width="260" height="300" rx="22" fill="#fff5e7" stroke="#dfb36b"/></g><text x="185" y="137" font-size="21" font-weight="700">路径 Path</text><text x="540" y="137" font-size="21" font-weight="700">轨迹 Trajectory</text><text x="895" y="137" font-size="21" font-weight="700">控制与反馈</text><path d="M90 285C125 210 190 325 280 190" fill="none" stroke="#247d67" stroke-width="5"/><g fill="#247d67"><circle cx="90" cy="285" r="7"/><circle cx="133" cy="245" r="7"/><circle cx="185" cy="269" r="7"/><circle cx="231" cy="250" r="7"/><circle cx="280" cy="190" r="7"/></g><text x="185" y="340" font-size="15" fill="#4c625a">q(s)：只有几何顺序</text><g transform="translate(448,180)"><path d="M0 120C42 118 58 28 112 35S165 120 182 16" fill="none" stroke="#247d67" stroke-width="4"/><path d="M0 122H190M2 135V5" stroke="#718d86" stroke-width="1.5"/><text x="100" y="155" font-size="14">time</text></g><text x="540" y="340" font-size="15" fill="#4c625a">q(t), q̇(t), q̈(t), time_from_start</text><g transform="translate(812,180)"><path d="M0 40H165V135H30V72H135V106H60" fill="none" stroke="#247d67" stroke-width="4"/><circle cx="0" cy="40" r="8" fill="#247ba0"/><circle cx="60" cy="106" r="8" fill="#f4b942"/></g><text x="895" y="340" font-size="15" fill="#4c625a">按周期下发，读取真实状态纠偏</text><g stroke="#247d67" stroke-width="3" marker-end="url(#a)"><path d="M315 245H402"/><path d="M670 245H757"/></g><rect x="120" y="435" width="840" height="46" rx="15" fill="#fff" stroke="#c9d8d2"/><text x="540" y="464" font-size="15" fill="#4c625a">时间参数化保证运动学限位，不自动保证控制误差、通信延迟、负载或真实碰撞安全。</text></g></svg>
