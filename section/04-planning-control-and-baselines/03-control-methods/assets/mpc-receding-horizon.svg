<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc"><title id="title">MPC滚动时域</title><desc id="desc">每个控制周期根据最新状态求解有限时域最优控制，仅执行第一段输入，然后窗口向前移动并使用上一解热启动。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#247d67"/></marker></defs><rect width="1120" height="560" rx="30" fill="#f8faf9"/><g font-family="Arial,'Microsoft YaHei',sans-serif"><text x="560" y="48" text-anchor="middle" font-size="27" font-weight="700" fill="#17251f">MPC 每次看向未来，但只承诺执行眼前一步</text><g transform="translate(80,92)"><text x="0" y="42" font-size="18" font-weight="700">时刻 k</text><path d="M120 38H900" stroke="#9aa8a3" stroke-width="2"/><g fill="#e4f5ef" stroke="#78b8a2"><rect x="120" y="0" width="95" height="75" rx="13"/><rect x="215" y="0" width="95" height="75" rx="13"/><rect x="310" y="0" width="95" height="75" rx="13"/><rect x="405" y="0" width="95" height="75" rx="13"/><rect x="500" y="0" width="95" height="75" rx="13"/><rect x="595" y="0" width="95" height="75" rx="13"/><rect x="690" y="0" width="95" height="75" rx="13"/></g><rect x="120" y="0" width="95" height="75" rx="13" fill="#ef8354" stroke="#b95e39" stroke-width="2"/><text x="167" y="31" text-anchor="middle" font-size="15" font-weight="700">执行 uₖ</text><text x="452" y="100" text-anchor="middle" font-size="14" fill="#4c625a">预测窗口：xₖ … xₖ₊ₙ</text><path d="M167 118V166" stroke="#247d67" stroke-width="3" marker-end="url(#a)"/><text x="0" y="212" font-size="18" font-weight="700">时刻 k+1</text><g transform="translate(95,175)" fill="#eef2ff" stroke="#9dadde"><rect x="120" y="0" width="95" height="75" rx="13"/><rect x="215" y="0" width="95" height="75" rx="13"/><rect x="310" y="0" width="95" height="75" rx="13"/><rect x="405" y="0" width="95" height="75" rx="13"/><rect x="500" y="0" width="95" height="75" rx="13"/><rect x="595" y="0" width="95" height="75" rx="13"/><rect x="690" y="0" width="95" height="75" rx="13"/></g><rect x="215" y="175" width="95" height="75" rx="13" fill="#ef8354" stroke="#b95e39" stroke-width="2"/><text x="262" y="206" text-anchor="middle" font-size="15" font-weight="700">执行 uₖ₊₁</text><text x="548" y="278" text-anchor="middle" font-size="14" fill="#4c625a">窗口右移，上一解移位作为 warm start</text></g><g transform="translate(85,410)"><rect width="950" height="92" rx="22" fill="#17251f"/><text x="35" y="36" font-size="15" fill="#9cf6e2">measure()</text><text x="215" y="36" font-size="15" fill="#f9c74f">solve horizon</text><text x="430" y="36" font-size="15" fill="#ef8354">apply first input</text><text x="680" y="36" font-size="15" fill="#b7a0d0">shift &amp; repeat</text><path d="M145 31H196M350 31H411M568 31H661" stroke="#d8e4df" stroke-width="2" marker-end="url(#a)"/><text x="475" y="70" text-anchor="middle" font-size="14" fill="#c8d8d2">模型误差和扰动在下一次测量时被重新纳入，而不是一次规划后开环执行到底</text></g></g></svg>
