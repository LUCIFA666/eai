<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc"><title id="title">MPC与WBC协同闭环</title><desc id="desc">MPC低频预测质心、基座、足端和接触力参考，WBC高频将参考投影到全身动力学和接触约束，关节控制器执行并由状态估计反馈。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#247d67"/></marker></defs><rect width="1160" height="620" rx="30" fill="#f7faf8"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="580" y="48" font-size="27" font-weight="700" fill="#17251f">典型腿足 / 人形闭环：MPC 看得远，WBC 跑得快</text><g stroke-width="2"><rect x="65" y="105" width="230" height="170" rx="24" fill="#eef2ff" stroke="#9dadde"/><rect x="350" y="105" width="230" height="170" rx="24" fill="#fff5e7" stroke="#dfb36b"/><rect x="635" y="105" width="230" height="170" rx="24" fill="#e4f5ef" stroke="#78b8a2"/><rect x="920" y="105" width="175" height="170" rx="24" fill="#f4edfa" stroke="#b7a0d0"/></g><g font-size="20" font-weight="700"><text x="180" y="145">任务 / gait</text><text x="465" y="145">MPC 20–100 Hz</text><text x="750" y="145">WBC 200–1000 Hz</text><text x="1007" y="145">机器人</text></g><g font-size="14" fill="#4c625a"><text x="180" y="185">base / CoM / foot</text><text x="180" y="212">mode schedule</text><text x="465" y="185">未来状态与输入</text><text x="465" y="212">接触力 / feedback policy</text><text x="750" y="185">动力学 + 接触 + task</text><text x="750" y="212">q̈ · τ · λ</text><text x="1007" y="185">actuator</text><text x="1007" y="212">contact</text></g><g stroke="#247d67" stroke-width="3" marker-end="url(#a)"><path d="M295 190H342"/><path d="M580 190H627"/><path d="M865 190H912"/></g><rect x="250" y="370" width="660" height="130" rx="24" fill="#17251f"/><text x="580" y="408" font-size="19" font-weight="700" fill="#9cf6e2">状态估计 / 安全监督</text><text x="580" y="441" font-size="15" fill="#fff">q · q̇ · base pose/twist · contact · wrench · timestamp</text><text x="580" y="472" font-size="14" fill="#f9c74f">策略过期、接触不一致或 QP infeasible → hold / damping / stop</text><path d="M1007 275V435H920" fill="none" stroke="#75549a" stroke-width="3" marker-end="url(#a)"/><path d="M465 370V285" stroke="#75549a" stroke-width="3" marker-end="url(#a)"/><path d="M750 370V285" stroke="#75549a" stroke-width="3" marker-end="url(#a)"/><rect x="130" y="548" width="900" height="35" rx="13" fill="#fff" stroke="#c9d8d2"/><text x="580" y="571" font-size="14" fill="#4c625a">接口必须明确 frame、顺序、单位、参考时间与接触编号；“都是 Eigen 向量”不代表语义兼容</text></g></svg>
