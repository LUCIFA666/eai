<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc"><title id="title">加权任务与严格层级任务</title><desc id="desc">加权QP将所有任务放入一个目标函数用权重折中，严格层级HQP先保证高优先级任务，再在其零空间或可行域中优化低优先级任务。</desc><rect width="1120" height="600" rx="30" fill="#f6f8f7"/><g font-family="Arial,'Microsoft YaHei',sans-serif"><text x="560" y="48" text-anchor="middle" font-size="27" font-weight="700" fill="#17251f">“权重很大”通常不等于“绝对优先”</text><g transform="translate(55,95)"><rect width="470" height="420" rx="24" fill="#fff5e7" stroke="#dfb36b" stroke-width="2"/><text x="235" y="42" text-anchor="middle" font-size="22" font-weight="700">加权 QP：一个秤盘</text><g transform="translate(65,95)"><path d="M170 40V245M45 95H295" stroke="#6b5a3c" stroke-width="7" stroke-linecap="round"/><path d="M45 95L5 185H85Z" fill="#eef2ff" stroke="#9dadde" stroke-width="2"/><path d="M295 95L235 210H355Z" fill="#e4f5ef" stroke="#78b8a2" stroke-width="2"/><text x="45" y="145" text-anchor="middle" font-size="15">手任务</text><text x="295" y="155" text-anchor="middle" font-size="15">姿态任务</text><text x="170" y="285" text-anchor="middle" font-size="16">min Σ wᵢ ‖Jᵢv + αeᵢ‖²</text></g><text x="235" y="365" text-anchor="middle" font-size="15" fill="#4c625a">优点：一次 QP、连续折中、实现直接</text><text x="235" y="393" text-anchor="middle" font-size="15" fill="#a65735">风险：单位/尺度变化会悄悄改变优先关系</text></g><g transform="translate(595,95)"><rect width="470" height="420" rx="24" fill="#e4f5ef" stroke="#78b8a2" stroke-width="2"/><text x="235" y="42" text-anchor="middle" font-size="22" font-weight="700">严格层级 HQP：逐层锁定</text><g transform="translate(90,88)"><rect x="0" y="0" width="290" height="64" rx="14" fill="#17251f"/><text x="145" y="39" text-anchor="middle" font-size="16" fill="#fff">Level 0：动力学 / 接触</text><rect x="25" y="88" width="240" height="64" rx="14" fill="#247d67"/><text x="145" y="127" text-anchor="middle" font-size="16" fill="#fff">Level 1：平衡 / 手任务</text><rect x="50" y="176" width="190" height="64" rx="14" fill="#75549a"/><text x="145" y="215" text-anchor="middle" font-size="16" fill="#fff">Level 2：姿态</text></g><text x="235" y="365" text-anchor="middle" font-size="15" fill="#4c625a">低层只能在高层最优集合中继续优化</text><text x="235" y="393" text-anchor="middle" font-size="15" fill="#a65735">风险：层级切换、退化与不可行需专门处理</text></g><rect x="150" y="545" width="820" height="32" rx="12" fill="#17251f"/><text x="560" y="567" text-anchor="middle" font-size="14" fill="#fff">先决定“绝不能违反什么”，再决定其余任务用严格层级还是可解释的加权折中</text></g></svg>
