<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc"><title id="title">最优控制问题的组成</title><desc id="desc">MPC问题由状态、输入、动力学、运行和终端代价、等式与不等式约束、初始状态和参考组成。</desc><rect width="1100" height="610" rx="30" fill="#f7f4ee"/><g font-family="Georgia,'Microsoft YaHei',serif"><text x="550" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#2b312f">一份 MPC 配置，本质是一份“未来行为合同”</text><rect x="70" y="90" width="960" height="435" rx="18" fill="#fffdf8" stroke="#b6aa92" stroke-width="2"/><text x="110" y="135" font-size="21" font-weight="700" fill="#2b312f">优化变量</text><text x="310" y="135" font-size="19" fill="#6d5a3a">x₀…xₙ, u₀…uₙ₋₁, contact / mode（可选）</text><path d="M105 158H995" stroke="#d5c8b1"/><text x="110" y="200" font-size="21" font-weight="700" fill="#2b312f">动力学</text><text x="310" y="200" font-size="19" fill="#6d5a3a">xₖ₊₁ = f(xₖ, uₖ)　或　ẋ = f(x,u,t)</text><text x="110" y="265" font-size="21" font-weight="700" fill="#2b312f">代价</text><text x="310" y="250" font-size="18" fill="#6d5a3a">运行：跟踪误差、控制量、平滑、碰撞余量</text><text x="310" y="281" font-size="18" fill="#6d5a3a">终端：到达目标、稳定性或终端集合</text><text x="110" y="345" font-size="21" font-weight="700" fill="#2b312f">硬约束</text><text x="310" y="330" font-size="18" fill="#6d5a3a">关节 / 力矩 / 摩擦锥 / 接触 / 状态边界</text><text x="310" y="361" font-size="18" fill="#6d5a3a">g(x,u)=0　h(x,u)≥0</text><text x="110" y="425" font-size="21" font-weight="700" fill="#2b312f">外部信息</text><text x="310" y="410" font-size="18" fill="#6d5a3a">当前测量 x̂、参考轨迹、场景/SDF、mode schedule</text><text x="310" y="441" font-size="18" fill="#6d5a3a">时间戳、模型参数、接触状态</text><path d="M105 470H995" stroke="#d5c8b1"/><text x="550" y="505" text-anchor="middle" font-size="18" font-weight="700" fill="#a65735">求解器返回的是候选策略；执行前仍需状态、限位、时延和安全检查</text><g transform="translate(140,548)" font-family="Arial,'Microsoft YaHei',sans-serif"><rect width="820" height="36" rx="12" fill="#2b312f"/><text x="410" y="24" text-anchor="middle" font-size="14" fill="#fffdf8">模型越复杂越接近真实，但求解时间、导数维护和数值脆弱性也同步上升</text></g></g></svg>
