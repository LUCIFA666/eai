<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc"><title id="title">MPC调试仪表盘</title><desc id="desc">MPC运行时应同时观察求解时间、策略年龄、代价分项、约束残差、控制饱和、模型预测和真实测量误差。</desc><rect width="1120" height="570" rx="30" fill="#f2f5f4"/><g font-family="Arial,'Microsoft YaHei',sans-serif"><text x="560" y="48" text-anchor="middle" font-size="27" font-weight="700" fill="#17251f">MPC 不能只看“机器人动了”：至少同时盯住六块仪表</text><g transform="translate(55,90)"><g stroke="#bdcbc6" stroke-width="2"><rect width="310" height="175" rx="20" fill="#fff"/><rect x="350" width="310" height="175" rx="20" fill="#fff"/><rect x="700" width="310" height="175" rx="20" fill="#fff"/><rect y="205" width="310" height="175" rx="20" fill="#fff"/><rect x="350" y="205" width="310" height="175" rx="20" fill="#fff"/><rect x="700" y="205" width="310" height="175" rx="20" fill="#fff"/></g><g font-size="18" font-weight="700" fill="#17251f"><text x="25" y="35">01 求解时间</text><text x="375" y="35">02 策略年龄</text><text x="725" y="35">03 代价分项</text><text x="25" y="240">04 约束残差</text><text x="375" y="240">05 输入饱和</text><text x="725" y="240">06 预测-实测偏差</text></g><path d="M25 135L65 110L105 125L145 65L185 88L225 58L275 72" fill="none" stroke="#247ba0" stroke-width="4"/><path d="M375 132H635" stroke="#c8d5d0" stroke-width="8"/><rect x="375" y="124" width="175" height="16" rx="8" fill="#f4b942"/><text x="505" y="94" text-anchor="middle" font-size="15" fill="#4c625a">now - policy_timestamp</text><g transform="translate(740,65)"><rect width="38" height="82" fill="#247d67"/><rect x="52" y="25" width="38" height="57" fill="#247ba0"/><rect x="104" y="45" width="38" height="37" fill="#ef8354"/><rect x="156" y="60" width="38" height="22" fill="#75549a"/></g><path d="M25 332C80 320 120 356 175 298S245 312 285 275" fill="none" stroke="#c43f2d" stroke-width="4"/><line x1="25" y1="300" x2="285" y2="300" stroke="#ef8354" stroke-dasharray="6 6"/><g transform="translate(375,275)"><rect width="260" height="64" rx="14" fill="#eef2ff"/><rect width="205" height="64" rx="14" fill="#ef8354" opacity=".8"/><text x="130" y="40" text-anchor="middle" font-size="17">|u| / u_max</text></g><g transform="translate(725,275)"><path d="M0 65C45 22 95 30 135 58S215 83 260 28" fill="none" stroke="#247d67" stroke-width="4"/><path d="M0 75C40 40 100 45 140 70S215 98 260 55" fill="none" stroke="#7a8793" stroke-width="3" stroke-dasharray="6 5"/><text x="130" y="118" text-anchor="middle" font-size="14" fill="#4c625a">prediction vs measurement</text></g></g><rect x="170" y="505" width="780" height="40" rx="14" fill="#17251f"/><text x="560" y="531" text-anchor="middle" font-size="14" fill="#fff">任何一块长期异常，都应触发降级 / 保持 / 停止，而不是继续发送陈旧策略</text></g></svg>
