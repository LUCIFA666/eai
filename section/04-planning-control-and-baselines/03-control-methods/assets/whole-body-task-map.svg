<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc"><title id="title">全身控制任务地图</title><desc id="desc">全身控制器在同一周期协调质心、基座、双手、双脚、视线、姿态、接触力和关节限位，并输出全身运动与力矩。</desc><rect width="1100" height="650" rx="30" fill="#f7faf8"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="550" y="48" font-size="27" font-weight="700" fill="#17251f">全身控制：不是“多控制几个关节”，而是协调相互竞争的任务</text><circle cx="550" cy="330" r="118" fill="#17251f"/><text x="550" y="313" font-size="24" font-weight="700" fill="#9cf6e2">WBC / HQP</text><text x="550" y="347" font-size="16" fill="#fff">q, v, contact → q̈, τ, λ</text><g stroke="#718d86" stroke-width="3"><path d="M473 245L315 150"/><path d="M550 212V105"/><path d="M627 245L785 150"/><path d="M432 330H230"/><path d="M668 330H870"/><path d="M473 415L315 510"/><path d="M550 448V555"/><path d="M627 415L785 510"/></g><g stroke-width="2"><circle cx="270" cy="125" r="78" fill="#eef2ff" stroke="#9dadde"/><circle cx="550" cy="95" r="72" fill="#fff5e7" stroke="#dfb36b"/><circle cx="830" cy="125" r="78" fill="#e4f5ef" stroke="#78b8a2"/><circle cx="185" cy="330" r="78" fill="#f4edfa" stroke="#b7a0d0"/><circle cx="915" cy="330" r="78" fill="#eaf3f8" stroke="#8cb4c9"/><circle cx="270" cy="535" r="78" fill="#fff0ed" stroke="#d6a091"/><circle cx="550" cy="565" r="70" fill="#edf7e6" stroke="#98ba7e"/><circle cx="830" cy="535" r="78" fill="#f3f0e6" stroke="#c0ad71"/></g><g font-size="18" font-weight="700"><text x="270" y="119">质心 / 动量</text><text x="270" y="145" font-size="14" font-weight="400">CoM · centroidal</text><text x="550" y="89">基座姿态</text><text x="550" y="115" font-size="14" font-weight="400">base pose</text><text x="830" y="119">手 / 工具</text><text x="830" y="145" font-size="14" font-weight="400">SE(3) task</text><text x="185" y="324">脚 / 接触</text><text x="185" y="350" font-size="14" font-weight="400">stance · swing</text><text x="915" y="324">视线 / 传感器</text><text x="915" y="350" font-size="14" font-weight="400">gaze · camera</text><text x="270" y="529">接触力</text><text x="270" y="555" font-size="14" font-weight="400">friction cone</text><text x="550" y="559">关节限位</text><text x="550" y="585" font-size="14" font-weight="400">q · v · τ</text><text x="830" y="529">默认姿态</text><text x="830" y="555" font-size="14" font-weight="400">posture / regularize</text></g></g></svg>
