<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc"><title id="title">浮动基机器人动力学与接触</title><desc id="desc">浮动基没有直接执行器，关节力矩和地面接触力共同产生全身加速度，动力学等式和接触约束连接运动与力。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#2f5f78"/></marker></defs><rect width="1120" height="610" rx="30" fill="#f4f1e9"/><g font-family="Arial,'Microsoft YaHei',sans-serif"><text x="560" y="48" text-anchor="middle" font-size="27" font-weight="700" fill="#263532">浮动基没有“腰部电机”把身体钉在世界里</text><g transform="translate(80,95)"><path d="M80 390H430" stroke="#8d846f" stroke-width="5"/><circle cx="255" cy="120" r="45" fill="#f4b942" stroke="#6f5b21" stroke-width="2"/><path d="M255 165V285M255 205L165 270M255 205L350 255M255 285L190 385M255 285L330 385" fill="none" stroke="#2f5f78" stroke-width="18" stroke-linecap="round"/><circle cx="190" cy="385" r="13" fill="#ef8354"/><circle cx="330" cy="385" r="13" fill="#ef8354"/><path d="M190 380V305" stroke="#247d67" stroke-width="5" marker-end="url(#a)"/><path d="M330 380V305" stroke="#247d67" stroke-width="5" marker-end="url(#a)"/><text x="150" y="335" font-size="15" fill="#247d67">λ₁</text><text x="345" y="335" font-size="15" fill="#247d67">λ₂</text><path d="M255 120H365" stroke="#75549a" stroke-width="4" marker-end="url(#a)"/><text x="380" y="125" font-size="15" fill="#75549a">base acceleration</text><text x="255" y="430" text-anchor="middle" font-size="15" fill="#4c625a">关节力矩只能通过机构和接触间接改变基座运动</text></g><g transform="translate(570,100)"><rect width="470" height="390" rx="22" fill="#fffdf8" stroke="#b9aa8c" stroke-width="2"/><text x="235" y="47" text-anchor="middle" font-size="22" font-weight="700">刚体动力学合同</text><text x="235" y="105" text-anchor="middle" font-size="24" fill="#2f5f78">M(q)q̈ + h(q,q̇)</text><text x="235" y="145" text-anchor="middle" font-size="24" fill="#2f5f78">= Sᵀτ + Jc(q)ᵀλ</text><path d="M45 175H425" stroke="#d4c7ae"/><g font-size="16"><text x="55" y="216" font-weight="700">q̈</text><text x="145" y="216">全身广义加速度</text><text x="55" y="254" font-weight="700">τ</text><text x="145" y="254">可驱动关节力矩</text><text x="55" y="292" font-weight="700">λ</text><text x="145" y="292">接触 wrench / force</text><text x="55" y="330" font-weight="700">S</text><text x="145" y="330">执行器选择矩阵</text><text x="55" y="368" font-weight="700">Jc</text><text x="145" y="368">接触 Jacobian</text></g></g><rect x="220" y="535" width="680" height="42" rx="14" fill="#263532"/><text x="560" y="562" text-anchor="middle" font-size="14" fill="#fffdf8">接触状态错一只脚，动力学可行域就会整体改变；WBC 必须接收可靠 contact estimate</text></g></svg>
