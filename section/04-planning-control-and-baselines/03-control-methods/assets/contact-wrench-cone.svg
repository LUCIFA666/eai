<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" role="img" aria-labelledby="title desc"><title id="title">接触力、摩擦锥与零加速度约束</title><desc id="desc">支撑接触要求法向力非负、切向力位于摩擦锥内，并通过接触雅可比约束接触点加速度。</desc><rect width="1080" height="580" rx="30" fill="#fbfaf7"/><g font-family="'Comic Sans MS','Microsoft YaHei',sans-serif"><text x="540" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#243b37">“脚踩在地上”同时是一条运动约束和一组力约束</text><g transform="translate(60,90)"><rect width="440" height="410" rx="24" fill="#fff" stroke="#a8b8b1" stroke-width="2"/><text x="220" y="38" text-anchor="middle" font-size="19" font-weight="700">运动侧：接触点不穿地、不打滑</text><path d="M65 300H375" stroke="#697a73" stroke-width="5"/><path d="M125 285L315 250L340 300H105Z" fill="#eef2ff" stroke="#536b91" stroke-width="3"/><circle cx="185" cy="290" r="9" fill="#ef8354"/><circle cx="300" cy="268" r="9" fill="#ef8354"/><path d="M185 288V180M300 266V156" stroke="#247d67" stroke-width="4"/><text x="185" y="145" text-anchor="middle" font-size="17">Jc q̈ + J̇c q̇ = 0</text><text x="220" y="355" text-anchor="middle" font-size="15" fill="#4c625a">刚性支撑阶段：接触点期望加速度为零</text></g><g transform="translate(580,90)"><rect width="440" height="410" rx="24" fill="#fff" stroke="#a8b8b1" stroke-width="2"/><text x="220" y="38" text-anchor="middle" font-size="19" font-weight="700">力侧：地面只能“推”，摩擦有限</text><path d="M80 325H360" stroke="#697a73" stroke-width="5"/><path d="M220 320L120 125H320Z" fill="#e4f5ef" opacity=".75" stroke="#247d67" stroke-width="3" stroke-dasharray="8 5"/><path d="M220 320V145" stroke="#2f5f78" stroke-width="5"/><path d="M220 320L290 220" stroke="#ef8354" stroke-width="5"/><text x="235" y="172" font-size="16">fₙ ≥ 0</text><text x="290" y="210" font-size="16">fₜ</text><text x="220" y="370" text-anchor="middle" font-size="15" fill="#4c625a">‖fₜ‖ ≤ μ fₙ；QP 中常用多面锥近似</text></g><text x="540" y="545" text-anchor="middle" font-size="15" fill="#4c625a">摩擦系数过高会虚构可行力，过低会让任务无解；真实脚底还要约束 CoP / wrench cone</text></g></svg>
