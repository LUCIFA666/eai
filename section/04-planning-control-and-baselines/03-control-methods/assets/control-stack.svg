<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 540" role="img" aria-labelledby="title desc"><title id="title">规划、MPC、全身控制与关节伺服的分层控制栈</title><desc id="desc">全局规划给出路径与任务参考，MPC预测未来并生成状态和力参考，全身控制协调接触与全身自由度，关节伺服驱动执行器，状态估计闭环反馈。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#247d67"/></marker></defs><rect width="1160" height="540" rx="30" fill="#f5f9f7"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="580" y="48" font-size="27" font-weight="700" fill="#17251f">从“去哪里”到“这一毫秒施加什么命令”</text><g stroke-width="2"><rect x="55" y="105" width="220" height="220" rx="24" fill="#eef2ff" stroke="#9dadde"/><rect x="330" y="105" width="220" height="220" rx="24" fill="#fff5e7" stroke="#dfb36b"/><rect x="605" y="105" width="220" height="220" rx="24" fill="#e4f5ef" stroke="#78b8a2"/><rect x="880" y="105" width="220" height="220" rx="24" fill="#f4edfa" stroke="#b7a0d0"/></g><g font-size="20" font-weight="700"><text x="165" y="148">4.1 / 4.2 规划</text><text x="440" y="148">MPC</text><text x="715" y="148">全身控制 WBC</text><text x="990" y="148">关节伺服 / 硬件</text></g><g font-size="15" fill="#4c625a"><text x="165" y="188">路径 · waypoint</text><text x="165" y="216">无碰撞轨迹</text><text x="165" y="244">任务阶段</text><text x="440" y="188">有限时域预测</text><text x="440" y="216">状态 / 输入 / 接触</text><text x="440" y="244">反馈策略与参考</text><text x="715" y="188">任务与接触约束</text><text x="715" y="216">q̈ · τ · λ</text><text x="715" y="244">优先级与限位</text><text x="990" y="188">位置 / 速度 / 力矩</text><text x="990" y="216">电流 · 饱和 · 急停</text><text x="990" y="244">高频闭环</text></g><g stroke="#247d67" stroke-width="3" marker-end="url(#a)"><path d="M275 215H322"/><path d="M550 215H597"/><path d="M825 215H872"/></g><path d="M990 325V418H440V334" fill="none" stroke="#75549a" stroke-width="3" marker-end="url(#a)"/><path d="M990 418H715V334" fill="none" stroke="#75549a" stroke-width="3" marker-end="url(#a)"/><rect x="240" y="395" width="680" height="88" rx="20" fill="#fff" stroke="#c9d8d2"/><text x="580" y="428" font-size="18" font-weight="700" fill="#75549a">状态估计与安全监测贯穿所有层</text><text x="580" y="458" font-size="15" fill="#4c625a">q, q̇, base pose, contact, wrench, timestamp · 超时 / 失配 / 饱和必须显式上报</text></g></svg>
