<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc"><title id="title">MPC求解器选择地图</title><desc id="desc">根据线性或非线性模型、约束类型、单射击或多重射击和实时预算，选择LQR、QP、DDP/iLQR、SQP或内点方法。</desc><rect width="1120" height="610" rx="30" fill="#eef4f7"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="560" y="48" font-size="27" font-weight="700" fill="#17251f">求解器不是排行榜：先看问题结构，再看实时预算</text><circle cx="560" cy="155" r="74" fill="#17251f"/><text x="560" y="146" font-size="19" font-weight="700" fill="#fff">你的 OCP</text><text x="560" y="174" font-size="14" fill="#9cf6e2">模型 · 约束 · 时域</text><g stroke="#718d86" stroke-width="3"><path d="M507 205L260 300"/><path d="M535 226L470 300"/><path d="M585 226L650 300"/><path d="M613 205L860 300"/></g><g stroke-width="2"><rect x="100" y="300" width="260" height="200" rx="24" fill="#eef2ff" stroke="#9dadde"/><rect x="380" y="300" width="220" height="200" rx="24" fill="#fff5e7" stroke="#dfb36b"/><rect x="620" y="300" width="220" height="200" rx="24" fill="#e4f5ef" stroke="#78b8a2"/><rect x="860" y="300" width="160" height="200" rx="24" fill="#f4edfa" stroke="#b7a0d0"/></g><g font-size="20" font-weight="700"><text x="230" y="342">线性 MPC / QP</text><text x="490" y="342">DDP / iLQR</text><text x="730" y="342">SQP</text><text x="940" y="342">IPM / SLP</text></g><g font-size="14" fill="#4c625a"><text x="230" y="378">线性模型、二次代价</text><text x="230" y="403">box / linear constraints</text><text x="230" y="438">结构清楚、成熟稳定</text><text x="490" y="378">沿轨迹局部二次化</text><text x="490" y="403">单射击、反馈策略</text><text x="490" y="438">非线性、warm start</text><text x="730" y="378">多重射击 + QP</text><text x="730" y="403">约束表达直接</text><text x="730" y="438">节点与稀疏结构重要</text><text x="940" y="378">一般非线性约束</text><text x="940" y="403">鲁棒但配置复杂</text><text x="940" y="438">关注迭代和残差</text></g><rect x="170" y="540" width="780" height="42" rx="14" fill="#fff" stroke="#bdcdd5"/><text x="560" y="567" font-size="14" fill="#4c625a">OCS2：SLQ / iLQR（DDP 家族）· SQP（HPIPM）· IPM · SLP；应以目标平台实测而非名字选型</text></g></svg>
