<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc"><title id="title">Pink与TSID的职责差异</title><desc id="desc">Pink在速度层求加权微分逆运动学，输入任务误差与限位，输出关节速度；TSID在加速度力矩层联合动力学、接触、运动和力任务，输出加速度、力矩与接触力。</desc><rect width="1120" height="610" rx="30" fill="#f5f9f7"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="560" y="48" font-size="27" font-weight="700" fill="#17251f">Pink 与 TSID 都是任务式控制，但解决层级不同</text><g stroke-width="2"><rect x="60" y="95" width="470" height="420" rx="26" fill="#ffe9f1" stroke="#d58ba8"/><rect x="590" y="95" width="470" height="420" rx="26" fill="#eaf3f8" stroke="#8cb4c9"/></g><text x="295" y="142" font-size="26" font-weight="700" fill="#a33162">Pink</text><text x="825" y="142" font-size="26" font-weight="700" fill="#285d79">TSID</text><g text-anchor="start" font-size="16"><text x="105" y="190" font-weight="700">层级</text><text x="210" y="190">速度 / differential IK</text><text x="105" y="235" font-weight="700">变量</text><text x="210" y="235">v 或 Δq</text><text x="105" y="280" font-weight="700">模型</text><text x="210" y="280">Pinocchio 运动学与几何</text><text x="105" y="325" font-weight="700">任务</text><text x="210" y="325">Frame · CoM · Posture</text><text x="105" y="370" font-weight="700">约束</text><text x="210" y="370">位置 / 速度 / 加速度 / barrier</text><text x="105" y="415" font-weight="700">输出</text><text x="210" y="415">关节速度，随后 integrate</text><text x="635" y="190" font-weight="700">层级</text><text x="740" y="190">加速度 / 力矩 / 接触</text><text x="635" y="235" font-weight="700">变量</text><text x="740" y="235">q̈, τ, λ</text><text x="635" y="280" font-weight="700">模型</text><text x="740" y="280">Pinocchio 刚体动力学</text><text x="635" y="325" font-weight="700">任务</text><text x="740" y="325">CoM · SE3 · posture · force</text><text x="635" y="370" font-weight="700">约束</text><text x="740" y="370">动力学 / 刚性接触 / 摩擦</text><text x="635" y="415" font-weight="700">输出</text><text x="740" y="415">加速度、执行器力矩、接触力</text></g><g font-size="15"><text x="295" y="472" fill="#a33162">适合快速原型、姿态与多任务运动学协调</text><text x="825" y="472" fill="#285d79">适合力矩控制、接触丰富和浮动基系统</text></g><rect x="150" y="545" width="820" height="34" rx="12" fill="#fff" stroke="#c9d8d2"/><text x="560" y="568" font-size="14" fill="#4c625a">Pink 不是 TSID 的“简化开关”；输出接口、模型要求和能保证的物理约束不同</text></g></svg>
