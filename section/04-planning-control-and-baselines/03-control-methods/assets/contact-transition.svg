<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc"><title id="title">接触切换状态机</title><desc id="desc">支撑、卸载、摆动、触地准备和重新支撑五个阶段需要逐步改变接触约束和力参考，并由事件与超时守卫。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#247d67"/></marker></defs><rect width="1120" height="570" rx="30" fill="#f6f3fa"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="560" y="48" font-size="27" font-weight="700" fill="#17251f">接触不是一个 boolean：切换过程决定是否冲击或失稳</text><g stroke-width="2"><rect x="55" y="180" width="170" height="120" rx="60" fill="#e4f5ef" stroke="#78b8a2"/><rect x="265" y="95" width="170" height="120" rx="60" fill="#fff5e7" stroke="#dfb36b"/><rect x="475" y="65" width="170" height="120" rx="60" fill="#eef2ff" stroke="#9dadde"/><rect x="685" y="95" width="170" height="120" rx="60" fill="#f4edfa" stroke="#b7a0d0"/><rect x="895" y="180" width="170" height="120" rx="60" fill="#e4f5ef" stroke="#78b8a2"/></g><g font-size="18" font-weight="700"><text x="140" y="235">支撑</text><text x="350" y="150">卸载</text><text x="560" y="120">摆动</text><text x="770" y="150">触地准备</text><text x="980" y="235">重新支撑</text></g><g font-size="13" fill="#4c625a"><text x="140" y="262">rigid contact</text><text x="350" y="177">force ↓</text><text x="560" y="147">contact off</text><text x="770" y="177">velocity ↓</text><text x="980" y="262">force ramp ↑</text></g><g stroke="#247d67" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M214 190L278 155"/><path d="M435 125L477 115"/><path d="M645 115L687 125"/><path d="M842 155L906 190"/></g><rect x="150" y="370" width="820" height="120" rx="20" fill="#fff" stroke="#c9d8d2"/><text x="560" y="405" font-size="18" font-weight="700" fill="#75549a">每条边都需要 guard</text><text x="560" y="438" font-size="15" fill="#4c625a">计划时间 + 足端高度/速度 + 力传感 + 接触估计 + timeout</text><text x="560" y="467" font-size="14" fill="#a65735">早加接触会产生冲击；晚加接触会让模型继续“自由落体”；传感抖动需要滞回与最短驻留时间</text></g></svg>
