<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
  <title id="title">MTC stage tree</title>
  <desc id="desc">MoveIt Task Constructor 抓放任务阶段树示意。</desc>
  <defs><style>
    .bg{fill:#fbf8f0}.box{fill:#fff;stroke:#cfc7b8;stroke-width:2;rx:14}.g{fill:#dfeee6;stroke:#0e6b50}.o{fill:#f6e4d6;stroke:#d46b32}.b{fill:#e1ebf4;stroke:#2d5f91}.t{font:700 20px "Microsoft YaHei",Arial,sans-serif;fill:#17211d}.s{font:14px "Microsoft YaHei",Arial,sans-serif;fill:#5d6b65}.line{stroke:#d46b32;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#d46b32"/></marker></defs>
  <rect class="bg" width="1180" height="520"/>
  <text x="42" y="52" class="t">MoveIt Task Constructor：把抓放任务拆成可解释的 stage</text>
  <rect x="465" y="85" width="250" height="62" class="box g"/><text x="515" y="124" class="t">Task: pick and place</text>
  <path d="M590 147 V185" class="line"/>
  <rect x="70" y="190" width="170" height="70" class="box"/><text x="96" y="222" class="t">CurrentState</text><text x="96" y="245" class="s">起始场景</text>
  <rect x="275" y="190" width="170" height="70" class="box b"/><text x="315" y="222" class="t">Open hand</text><text x="315" y="245" class="s">关节插值</text>
  <rect x="480" y="190" width="170" height="70" class="box o"/><text x="518" y="222" class="t">Connect</text><text x="518" y="245" class="s">移动到抓取前</text>
  <rect x="685" y="190" width="190" height="70" class="box g"/><text x="716" y="222" class="t">GenerateGrasp</text><text x="716" y="245" class="s">采样抓取姿态</text>
  <rect x="910" y="190" width="190" height="70" class="box"/><text x="950" y="222" class="t">ComputeIK</text><text x="950" y="245" class="s">计算关节解</text>
  <path d="M240 225 H270" class="line"/><path d="M445 225 H475" class="line"/><path d="M650 225 H680" class="line"/><path d="M875 225 H905" class="line"/>
  <rect x="165" y="335" width="190" height="70" class="box o"/><text x="194" y="367" class="t">Attach object</text><text x="194" y="390" class="s">修改 Planning Scene</text>
  <rect x="400" y="335" width="170" height="70" class="box"/><text x="448" y="367" class="t">Lift</text><text x="448" y="390" class="s">笛卡尔上抬</text>
  <rect x="615" y="335" width="190" height="70" class="box b"/><text x="642" y="367" class="t">Move to place</text><text x="642" y="390" class="s">连接到放置区</text>
  <rect x="850" y="335" width="190" height="70" class="box g"/><text x="885" y="367" class="t">Detach / open</text><text x="885" y="390" class="s">放下物体</text>
  <path d="M1005 260 C1005 308 260 300 260 330" class="line"/>
  <path d="M355 370 H395" class="line"/><path d="M570 370 H610" class="line"/><path d="M805 370 H845" class="line"/>
</svg>
