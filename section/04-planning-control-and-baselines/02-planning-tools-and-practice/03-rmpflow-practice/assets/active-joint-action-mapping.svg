<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 400" role="img" aria-labelledby="t d"><title id="t">Active joint 动作映射</title><desc id="d">Franka 七个手臂关节目标映射到九自由度 articulation，夹爪保持独立。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#247d67"/></marker></defs><rect width="1050" height="400" rx="28" fill="#f6faf8"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="525" y="44" font-size="25" font-weight="700" fill="#17251f">按关节名称映射，不按数组位置猜测</text><rect x="45" y="105" width="300" height="210" rx="22" fill="#e1f3ec" stroke="#75b19d" stroke-width="2"/><rect x="440" y="105" width="185" height="210" rx="22" fill="#fff" stroke="#bfd7cf" stroke-width="2"/><rect x="720" y="105" width="285" height="210" rx="22" fill="#eef2ff" stroke="#aebce5" stroke-width="2"/><text x="195" y="145" font-size="20" font-weight="700">RmpFlow</text><text x="195" y="180" font-size="15">panda_joint1 … joint7</text><text x="195" y="215" font-size="15">7 维 position targets</text><text x="195" y="250" font-size="15">7 维 velocity targets</text><text x="195" y="285" font-size="14" fill="#52625c">Active joints only</text><text x="532" y="145" font-size="18" font-weight="700">Wrapper</text><text x="532" y="182" font-size="14">匹配名称</text><text x="532" y="212" font-size="14">生成 indices</text><text x="532" y="242" font-size="14">保留未控 DOF</text><text x="862" y="145" font-size="20" font-weight="700">Franka Articulation</text><text x="862" y="180" font-size="15">7 个手臂关节</text><text x="862" y="215" font-size="15">+ 2 个夹爪关节</text><text x="862" y="250" font-size="15">= 9 DOF action contract</text><text x="862" y="285" font-size="14" fill="#52625c">夹爪由独立逻辑控制</text><g stroke="#247d67" stroke-width="3" marker-end="url(#a)"><path d="M345 210H433"/><path d="M625 210H713"/></g><text x="525" y="365" font-size="15" fill="#53635d">比较 command 与 measured state 前，先按 joint_indices 对齐 shape</text></g></svg>
