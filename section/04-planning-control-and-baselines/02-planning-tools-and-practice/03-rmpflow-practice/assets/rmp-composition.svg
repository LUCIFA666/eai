<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 520" role="img" aria-labelledby="t d"><title id="t">局部 RMP 合成</title><desc id="d">目标、碰撞、关节限位与阻尼策略经任务映射合成为关节空间策略。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#247d67"/></marker></defs><rect width="1050" height="520" rx="28" fill="#f5f9f7"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="525" y="44" font-size="25" font-weight="700" fill="#17251f">不同任务空间中的局部策略</text><g stroke-width="2"><rect x="55" y="90" width="220" height="90" rx="18" fill="#e9f3ff" stroke="#99b9dc"/><rect x="55" y="210" width="220" height="90" rx="18" fill="#fff1e6" stroke="#dda46c"/><rect x="55" y="330" width="220" height="90" rx="18" fill="#f5edff" stroke="#bba4d5"/><rect x="350" y="140" width="310" height="230" rx="24" fill="#e1f3ec" stroke="#70ae99"/><rect x="740" y="190" width="260" height="130" rx="22" fill="#fff" stroke="#b9d5cb"/></g><text x="165" y="125" font-size="18" font-weight="700">Target / Axis RMP</text><text x="165" y="153" font-size="14">末端位置与姿态空间</text><text x="165" y="245" font-size="18" font-weight="700">Collision RMP</text><text x="165" y="273" font-size="14">碰撞球—障碍距离空间</text><text x="165" y="365" font-size="18" font-weight="700">Limit / Damping</text><text x="165" y="393" font-size="14">单关节与速度空间</text><text x="505" y="195" font-size="22" font-weight="700" fill="#14795c">RMPflow 计算图</text><text x="505" y="235" font-size="15">沿运动学映射 pull back</text><text x="505" y="268" font-size="15">组合加速度与度量矩阵</text><text x="505" y="301" font-size="15">处理互相竞争的目标</text><text x="505" y="334" font-size="15">得到 configuration-space policy</text><text x="870" y="235" font-size="19" font-weight="700">全局关节策略</text><text x="870" y="270" font-size="15">q, q̇ → q̈</text><g stroke="#247d67" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M275 135H335V205H344"/><path d="M275 255H344"/><path d="M275 375H335V305H344"/><path d="M660 255H733"/></g><text x="525" y="470" font-size="15" fill="#53635d">度量矩阵表达：当前状态下，哪个策略、哪个方向更值得优先满足</text></g></svg>
