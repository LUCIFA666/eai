<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" role="img" aria-labelledby="t d"><title id="t">RMPflow 自定义机器人配置</title><desc id="d">URDF、Robot Description 与 RMPflow Config 共同构造 RmpFlow，再通过 Widget 和场景测试。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#247d67"/></marker></defs><rect width="1080" height="430" rx="28" fill="#f6faf8"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="540" y="44" font-size="25" font-weight="700" fill="#17251f">三份配置共同定义一个可运行的 Motion Policy</text><g fill="#fff" stroke="#bed8cf" stroke-width="2"><rect x="35" y="90" width="250" height="100" rx="18"/><rect x="35" y="210" width="250" height="100" rx="18"/><rect x="35" y="330" width="250" height="70" rx="18"/><rect x="390" y="145" width="280" height="190" rx="22"/><rect x="775" y="145" width="270" height="190" rx="22"/></g><text x="160" y="128" font-size="18" font-weight="700">URDF</text><text x="160" y="158" font-size="14">运动学 · 名称 · 关节限位</text><text x="160" y="248" font-size="18" font-weight="700">Robot Description YAML</text><text x="160" y="278" font-size="14">C-space · 默认姿态 · 碰撞球</text><text x="160" y="360" font-size="18" font-weight="700">RMPflow Config YAML</text><text x="160" y="385" font-size="14">RMP 参数与限制</text><text x="530" y="190" font-size="21" font-weight="700" fill="#14795c">RmpFlow</text><text x="530" y="228" font-size="15">End-effector Frame</text><text x="530" y="260" font-size="15">Maximum Substep Size</text><text x="530" y="292" font-size="15">World / Robot State</text><text x="910" y="190" font-size="20" font-weight="700">分层验收</text><text x="910" y="228" font-size="15">Lula Test Widget</text><text x="910" y="260" font-size="15">静态与动态目标</text><text x="910" y="292" font-size="15">避障 · 限位 · Reset</text><g stroke="#247d67" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M285 140H350V195H383"/><path d="M285 260H383"/><path d="M285 365H350V285H38