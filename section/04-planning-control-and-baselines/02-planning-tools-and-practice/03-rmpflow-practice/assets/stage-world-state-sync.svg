<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 440" role="img" aria-labelledby="t d"><title id="t">Stage 和 World State 同步</title><desc id="d">USD Stage 中的受支持对象需要注册并更新到 RmpFlow World State。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#247d67"/></marker></defs><rect width="1050" height="440" rx="28" fill="#f5f9f7"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="525" y="44" font-size="25" font-weight="700" fill="#17251f">看得见的 Stage，不等于策略已经知道</text><rect x="55" y="90" width="350" height="270" rx="24" fill="#eef2ff" stroke="#aebce5" stroke-width="2"/><rect x="645" y="90" width="350" height="270" rx="24" fill="#e1f3ec" stroke="#75b19d" stroke-width="2"/><text x="230" y="130" font-size="21" font-weight="700">USD Stage</text><text x="820" y="130" font-size="21" font-weight="700" fill="#14795c">RmpFlow World State</text><g fill="#fff" stroke="#c2d5ce"><rect x="100" y="165" width="260" height="48" rx="14"/><rect x="100" y="230" width="260" height="48" rx="14"/><rect x="100" y="295" width="260" height="48" rx="14"/><rect x="690" y="165" width="260" height="48" rx="14"/><rect x="690" y="230" width="260" height="48" rx="14"/><rect x="690" y="295" width="260" height="48" rx="14"/></g><text x="230" y="195" font-size="15">Robot / Target Prims</text><text x="230" y="260" font-size="15">Cuboid / Sphere / Mesh...</text><text x="230" y="325" font-size="15">World Poses</text><text x="820" y="195" font-size="15">显式注册的障碍物</text><text x="820" y="260" font-size="15">受支持的几何近似</text><text x="820" y="325" font-size="15">Robot Base-relative Query</text><path d="M405 190H638" stroke="#247d67" stroke-width="3" marker-end="url(#a)"/><text x="522" y="177" font-size="14" font-weight="700">add_obstacle()</text><path d="M405 282H638" stroke="#247d67" stroke-width="3" marker-end="url(#a)"/><text x="522" y="269" font-size="14" font-weight="700">update_world()</text><text x="525"