<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 430" role="img" aria-labelledby="t d"><title id="t">策略与控制器调试分离</title><desc id="d">内部 rollout collision spheres 与真实 PhysX robot 对照定位策略或控制器问题。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#247d67"/></marker></defs><rect width="1020" height="430" rx="28" fill="#f5f9f7"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="510" y="44" font-size="25" font-weight="700" fill="#17251f">同一目标，两条状态演化路径</text><rect x="55" y="90" width="410" height="245" rx="24" fill="#e1f3ec" stroke="#72af9a" stroke-width="2"/><rect x="555" y="90" width="410" height="245" rx="24" fill="#eef2ff" stroke="#aebce5" stroke-width="2"/><text x="260" y="130" font-size="20" font-weight="700" fill="#14795c">RmpFlow 内部 Rollout</text><text x="760" y="130" font-size="20" font-weight="700">PhysX Articulation</text><text x="260" y="172" font-size="15">ignore_state_updates = True</text><text x="260" y="208" font-size="15">假设每个 target 被完美实现</text><text x="260" y="244" font-size="15">Collision spheres 显示策略轨迹</text><text x="260" y="280" font-size="15">用于判断算法自身是否合理</text><text x="760" y="172" font-size="15">PD gains + effort limits</text><text x="760" y="208" font-size="15">接触、惯量与真实跟踪误差</text><text x="760" y="244" font-size="15">Robot mesh 显示仿真实际状态</text><text x="760" y="280" font-size="15">用于判断控制执行是否跟上</text><path d="M465 212H548" stroke="#247d67" stroke-width="3" marker-end="url(#a)"/><text x="510" y="198" font-size="14" font-weight="700">对照</text><rect x="235" y="365" width="550" height="42" rx="21" fill="#fff3df"/><text x="510" y="392" font-size="16" font-weight="700">内部合理、真实滞后 → 优先检查控制器，而不是继续加大 RMP gain</text></g></svg>
