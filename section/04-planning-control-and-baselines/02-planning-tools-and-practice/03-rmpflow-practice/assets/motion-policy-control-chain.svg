<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 360" role="img" aria-labelledby="t d"><title id="t">Motion Policy 控制链路</title><desc id="d">加速度策略经积分、关节映射与 PD 控制器驱动 PhysX 机器人。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#247d67"/></marker></defs><rect width="1050" height="360" rx="28" fill="#f6faf8"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="525" y="44" font-size="25" font-weight="700" fill="#17251f">从加速度策略到仿真关节</text><g fill="#fff" stroke="#bcd7cd" stroke-width="2"><rect x="35" y="115" width="185" height="110" rx="18"/><rect x="280" y="115" width="185" height="110" rx="18"/><rect x="525" y="115" width="210" height="110" rx="18"/><rect x="795" y="115" width="220" height="110" rx="18"/></g><text x="127" y="153" font-size="18" font-weight="700">RmpFlow</text><text x="127" y="183" font-size="14">期望关节加速度</text><text x="127" y="207" font-size="14">active joints</text><text x="372" y="153" font-size="18" font-weight="700">数值积分</text><text x="372" y="183" font-size="14">position / velocity</text><text x="372" y="207" font-size="14">joint targets</text><text x="630" y="153" font-size="18" font-weight="700">关节名称映射</text><text x="630" y="183" font-size="14">7 active → 9 DOF</text><text x="630" y="207" font-size="14">ArticulationAction</text><text x="905" y="153" font-size="18" font-weight="700">PD + PhysX</text><text x="905" y="183" font-size="14">目标不等于真实状态</text><text x="905" y="207" font-size="14">必须检查 tracking error</text><g stroke="#247d67" stroke-width="3" marker-end="url(#a)"><path d="M220 170H273"/><path d="M465 170H518"/><path d="M735 170H788"/></g><rect x="270" y="276" width="510" height="46" rx="23" fill="#e1f3ec"/><text x="525" y="305" font-size="16" font-weight="700">maximum_substep_size 只约束内部积分步长</text></g></svg>
