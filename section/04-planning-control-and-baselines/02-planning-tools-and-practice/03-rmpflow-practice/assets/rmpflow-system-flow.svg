<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" role="img" aria-labelledby="t d"><title id="t">RMPflow 系统执行链路</title><desc id="d">目标、世界和机器人状态经 RmpFlow、关节映射与控制器变成机器人运动。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#287b65"/></marker><linearGradient id="g" x2="1" y2="1"><stop stop-color="#f0faf6"/><stop offset="1" stop-color="#eef3ff"/></linearGradient></defs><rect width="1100" height="390" rx="28" fill="url(#g)"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="550" y="45" font-size="25" font-weight="700" fill="#17231f">RMPflow 从环境状态到机器人动作</text><g fill="#fff" stroke="#bdd7ce" stroke-width="2"><rect x="35" y="90" width="210" height="210" rx="18"/><rect x="300" y="120" width="190" height="150" rx="18"/><rect x="545" y="120" width="225" height="150" rx="18"/><rect x="825" y="120" width="235" height="150" rx="18"/></g><text x="140" y="130" font-size="19" font-weight="700">输入状态</text><text x="140" y="170" font-size="15">Target Pose</text><text x="140" y="205" font-size="15">World State</text><text x="140" y="240" font-size="15">Robot State</text><text x="395" y="168" font-size="21" font-weight="700" fill="#13795b">RmpFlow</text><text x="395" y="203" font-size="14">组合局部 RMP</text><text x="395" y="230" font-size="14">积分 active joint targets</text><text x="657" y="165" font-size="18" font-weight="700">Articulation</text><text x="657" y="190" font-size="18" font-weight="700">MotionPolicy</text><text x="657" y="228" font-size="14">映射到完整 DOF action</text><text x="942" y="165" font-size="19" font-weight="700">关节控制器</text><text x="942" y="202" font-size="14">Stiffness · Damping</text><text x="942" y="228" font-size="14">PhysX Articulation</text><g stroke="#287b65" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M245 195H293"/><path d="M490 195H538"/><path d="M770 195H818"/></g><rect x="325" y="322" width="450" height="42" rx="21" fill="#dff2e