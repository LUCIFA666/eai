<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc"><title id="title">FK IK 往返验证</title><desc id="desc">已知关节角经过正运动学得到位姿，再经逆运动学求解关节角，最后正运动学验证位姿。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#247d67"/></marker></defs><rect width="1000" height="330" rx="26" fill="#f6faf8"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="500" y="45" font-size="25" font-weight="700" fill="#17251f">用 FK → IK → FK 做闭环自检</text><g fill="#fff" stroke="#bed8cf" stroke-width="2"><rect x="40" y="120" width="180" height="100" rx="18"/><rect x="285" y="120" width="180" height="100" rx="18"/><rect x="530" y="120" width="180" height="100" rx="18"/><rect x="775" y="120" width="180" height="100" rx="18"/></g><text x="130" y="158" font-size="18" font-weight="700">Known q</text><text x="130" y="188" font-size="14">已知关节角</text><text x="375" y="158" font-size="18" font-weight="700">Known Tool Pose</text><text x="375" y="188" font-size="14">模型给出的位姿</text><text x="620" y="158" font-size="18" font-weight="700">q Solution</text><text x="620" y="188" font-size="14">IK 返回的有效解</text><text x="865" y="158" font-size="18" font-weight="700" fill="#14795c">Pose Check</text><text x="865" y="188" font-size="14">位置与姿态误差</text><g stroke="#247d67" stroke-width="3" marker-end="url(#a)"><path d="M220 170H278"/><path d="M465 170H523"/><path d="M710 170H768"/></g><g fill="#247d67" font-size="14" font-weight="700"><text x="250" y="153">FK</text><text x="495" y="153">IK</text><text x="740" y="153">FK</text></g><text x="500" y="277" font-size="15" fill="#52625c">误差异常时优先检查：Joint Order · Base Frame · EE Link · Quaternion Convention</text></g></svg>
