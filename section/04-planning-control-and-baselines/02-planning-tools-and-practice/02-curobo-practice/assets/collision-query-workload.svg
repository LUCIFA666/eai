<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc"><title id="title">碰撞查询工作量</title><desc id="desc">目标数量乘以每目标种子数，再乘以优化过程中的碰撞查询。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#257d67"/></marker></defs><rect width="1000" height="330" rx="26" fill="#f5f9f7"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="500" y="48" font-size="25" font-weight="700" fill="#17251f">批量 IK 的实际计算规模</text><g fill="#fff" stroke="#b9d7cd" stroke-width="2"><rect x="55" y="105" width="230" height="120" rx="18"/><rect x="385" y="105" width="230" height="120" rx="18"/><rect x="715" y="105" width="230" height="120" rx="18"/></g><text x="170" y="147" font-size="28" font-weight="700" fill="#14795c">50</text><text x="170" y="181" font-size="17">Target Poses</text><text x="170" y="207" font-size="14" fill="#586660">目标 batch</text><text x="500" y="147" font-size="28" font-weight="700" fill="#14795c">× 32</text><text x="500" y="181" font-size="17">Seeds / Target</text><text x="500" y="207" font-size="14" fill="#586660">并行候选初值</text><text x="830" y="147" font-size="28" font-weight="700" fill="#b07108">× N</text><text x="830" y="181" font-size="17">Collision Queries</text><text x="830" y="207" font-size="14" fill="#586660">每轮优化反复调用</text><g stroke="#257d67" stroke-width="3" marker-end="url(#a)"><path d="M285 165H378"/><path d="M615 165H708"/></g><rect x="315" y="264" width="370" height="40" rx="20" fill="#dff3eb"/><text x="500" y="290" font-size="17" font-weight="700">显存不足时：先减 batch，再减 seeds</text></g></svg>
