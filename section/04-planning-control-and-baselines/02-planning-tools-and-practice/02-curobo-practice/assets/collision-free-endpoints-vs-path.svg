<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc"><title id="title">端点安全不等于路径安全</title><desc id="desc">起点和终点均无碰撞，但直线插值穿过中间障碍物。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#d05d4a"/></marker></defs><rect width="1000" height="380" rx="26" fill="#f7faf8"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="500" y="45" font-size="25" font-weight="700" fill="#17251f">起点和终点都安全，中间仍可能碰撞</text><line x1="120" y1="292" x2="880" y2="292" stroke="#9cb4ab" stroke-width="8" stroke-linecap="round"/><rect x="430" y="105" width="140" height="190" rx="12" fill="#f0aa67" stroke="#ba682f" stroke-width="3"/><text x="500" y="148" font-size="18" font-weight="700">桌面 / 障碍物</text><circle cx="160" cy="245" r="34" fill="#56aa8d"/><circle cx="840" cy="245" r="34" fill="#56aa8d"/><text x="160" y="335" font-size="17" font-weight="700">Start q ✓</text><text x="840" y="335" font-size="17" font-weight="700">Goal q ✓</text><path d="M195 235 C330 80 660 80 805 235" fill="none" stroke="#d05d4a" stroke-width="5" stroke-dasharray="12 9" marker-end="url(#a)"/><circle cx="500" cy="105" r="17" fill="#d44f42"/><path d="M490 95L510 115M510 95L490 115" stroke="white" stroke-width="4"/><text x="500" y="78" font-size="16" fill="#a33e34">朴素插值发生碰撞</text></g></svg>
