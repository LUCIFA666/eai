<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" role="img" aria-labelledby="title desc"><title id="title">仿真器与 cuRobo 接口</title><desc id="desc">仿真器向 cuRobo 传递关节状态、目标位姿和场景，cuRobo 返回插值关节轨迹。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#247d67"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto"><path d="M10 0L0 3L10 6Z" fill="#b06e12"/></marker></defs><rect width="1080" height="470" rx="28" fill="#f5f9f7"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="540" y="46" font-size="25" font-weight="700" fill="#17251f">仿真器与 cuRobo 之间只交换四类数据</text><rect x="45" y="100" width="260" height="300" rx="24" fill="#eef2ff" stroke="#aebce6" stroke-width="2"/><rect x="775" y="100" width="260" height="300" rx="24" fill="#e1f3ec" stroke="#75b19d" stroke-width="2"/><text x="175" y="145" font-size="21" font-weight="700">Isaac Sim</text><text x="175" y="174" font-size="15">或其他仿真器</text><text x="905" y="145" font-size="22" font-weight="700" fill="#14795c">cuRobo</text><text x="905" y="174" font-size="15">运动生成与碰撞查询</text><g fill="#fff" stroke="#c7d9d2"><rect x="355" y="105" width="370" height="56" rx="15"/><rect x="355" y="185" width="370" height="56" rx="15"/><rect x="355" y="265" width="370" height="56" rx="15"/><rect x="355" y="345" width="370" height="56" rx="15"/></g><text x="540" y="140" font-size="16" font-weight="700">Current Joint State → JointState</text><text x="540" y="220" font-size="16" font-weight="700">Goal Marker / Task Pose → GoalToolPose</text><text x="540" y="300" font-size="16" font-weight="700">Obstacle Geometry in Robot Base → Scene</text><text x="540" y="380" font-size="16" font-weight="700" fill="#9a5d0a">Interpolated Joint Trajectory → Execute</text><g stroke="#247d67" stroke-width="3" marker-end="url(#a)"><path d="M305 133H348"/><path d="M725 133H768"/><path d="M305 213H348"/><path d="M725 213H768"/><path d="M305 293H348"/><path d="M725 293H768"/></g><g stroke="#b06e12" stroke-width="3" marker-start="url(#b)"><path d="M305 373H348"/><path d="M725 373H768"/></g><text x="175" y="350" font-size="14" fill="#52625c">提供状态、目标与场景</text><text x="905" y="350" font-size="14" fill="#52625c">返回可执行轨迹</text></g></svg>
