<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 560" role="img" aria-labelledby="title desc"><title id="title">自定义机器人构建与验证流程</title><desc id="desc">URDF 和网格经过 RobotBuilder 解析、碰撞建模、自碰撞配置，形成配置后执行多项测试。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#247d67"/></marker></defs><rect width="1050" height="560" rx="28" fill="#f5f9f7"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="525" y="44" font-size="25" font-weight="700" fill="#17251f">自定义机器人：构建只是开始，验证才是闭环</text><g fill="#fff" stroke="#bdd8cf" stroke-width="2"><rect x="45" y="185" width="170" height="100" rx="18"/><rect x="270" y="145" width="210" height="180" rx="18"/><rect x="535" y="145" width="210" height="180" rx="18"/><rect x="800" y="125" width="205" height="220" rx="18"/></g><text x="130" y="225" font-size="19" font-weight="700">URDF + Meshes</text><text x="130" y="254" font-size="14">运动学与几何输入</text><text x="375" y="181" font-size="19" font-weight="700" fill="#14795c">RobotBuilder</text><text x="375" y="218" font-size="14">解析运动学树</text><text x="375" y="246" font-size="14">读取关节限位</text><text x="375" y="274" font-size="14">确认 Tool Frames</text><text x="375" y="302" font-size="14">解析 Mesh 路径</text><text x="640" y="181" font-size="19" font-weight="700">碰撞建模</text><text x="640" y="218" font-size="14">拟合 Collision Spheres</text><text x="640" y="246" font-size="14">计算 Self-Collision</text><text x="640" y="274" font-size="14">Ignore Matrix</text><text x="640" y="302" font-size="14">核对安全 Buffer</text><text x="902" y="163" font-size="19" font-weight="700">配置与回归</text><text x="902" y="201" font-size="14">robot.yml / robot.xrdf</text><text x="902" y="237" font-size="14">✓ FK Smoke Test</text><text x="902" y="267" font-size="14">✓ IK Known-Pose Test</text><text x="902" y="297" font-size="14">✓ Collision Test</text><text x="902" y="327" font-size="14">✓ Planning Regression</text><g stroke="#247d67" stroke-width="4" marker-end="url(#a)"><path d="M215 235H263"/><path d="M480 235H528"/><path d="M745 235H793"/></g><rect x="265" y="400" width="520" height="90" rx="20" fill="#e2f3ed" stroke="#78b39f" stroke-width="2"/><text x="525" y="436" font-size="18" font-weight="700">通过标准</text><text x="525" y="466" font-size="15">坐标系正确 · 关节顺序正确 · 碰撞近似可解释 · 规划结果可重复</text></g></svg>
