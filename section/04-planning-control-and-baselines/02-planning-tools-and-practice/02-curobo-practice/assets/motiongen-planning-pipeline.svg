<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" role="img" aria-labelledby="title desc"><title id="title">MotionGen 规划流程</title><desc id="desc">从起始状态、目标和场景，经目标逆解、轨迹种子、优化、图搜索兜底、插值和时间参数化，得到稠密轨迹。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#247d67"/></marker></defs><rect width="1040" height="720" rx="28" fill="#f5f9f7"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="520" y="43" font-size="25" font-weight="700" fill="#17251f">MotionGen：优化主线与图搜索兜底</text><g fill="#fff" stroke="#bdd8cf" stroke-width="2"><rect x="250" y="70" width="540" height="62" rx="16"/><rect x="350" y="172" width="340" height="62" rx="16"/><rect x="350" y="274" width="340" height="62" rx="16"/><rect x="350" y="376" width="340" height="82" rx="16"/><rect x="350" y="506" width="340" height="62" rx="16"/><rect x="350" y="608" width="340" height="62" rx="16"/></g><text x="520" y="108" font-size="18" font-weight="700">Start JointState + Goal Tool Pose + Scene</text><text x="520" y="210" font-size="18" font-weight="700">Goal IK / Goalset</text><text x="520" y="312" font-size="18" font-weight="700">Initial Trajectory Seeds</text><text x="520" y="407" font-size="18" font-weight="700" fill="#14795c">Trajectory Optimization</text><text x="520" y="437" font-size="14">平滑度 · 关节限位 · 碰撞约束</text><text x="520" y="544" font-size="18" font-weight="700">Optimized Trajectory</text><text x="520" y="646" font-size="18" font-weight="700" fill="#14795c">Dense JointState Trajectory</text><rect x="760" y="360" width="230" height="112" rx="18" fill="#fff7e8" stroke="#dfb463" stroke-width="2"/><text x="875" y="397" font-size="18" font-weight="700">Graph Planner</text><text x="875" y="427" font-size="14">全部直接 seed 不可行时</text><text x="875" y="451" font-size="14">搜索绕障路径并返回新 seed</text><g stroke="#247d67" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M520 132V166"/><path d="M520 234V268"/><path d="M520 336V370"/><path d="M520 458V500"/><path d="M520 568V602"/><path d="M690 417H754"/><path d="M875 472V487H710V517H696"/></g><rect x="50" y="376" width="220" height="82" rx="16" fill="#e6f4ef" stroke="#8dbdab" stroke-width="2"/><text x="160" y="407" font-size="17" font-weight="700">直接优化成功？</text><text x="160" y="437" font-size="14">成功：进入结果整理</text><path d="M350 417H276" stroke="#247d67" stroke-width="3" marker-end="url(#a)"/><path d="M160 458V487H330V517H344" fill="none" stroke="#247d67" stroke-width="3" marker-end="url(#a)"/><text x="520" y="695" font-size="14" fill="#52625c">Interpolation / Retiming</text></g></svg>
