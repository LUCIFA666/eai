<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">cuRobo 求解管线</title><desc id="desc">状态、目标和场景进入机器人模型，生成候选种子，经过优化和图搜索后输出无碰撞轨迹。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#23846b"/></marker><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".1"/></filter></defs>
  <rect width="1000" height="650" rx="26" fill="#f5f9f7"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle">
    <text x="500" y="42" font-size="25" font-weight="700" fill="#182620">cuRobo：并行优化为主，图搜索按需兜底</text>
    <g fill="#fff" stroke="#bed8cf" stroke-width="2" filter="url(#s)"><rect x="70" y="76" width="240" height="78" rx="16"/><rect x="380" y="76" width="240" height="78" rx="16"/><rect x="690" y="76" width="240" height="78" rx="16"/><rect x="300" y="210" width="400" height="82" rx="16"/><rect x="300" y="342" width="400" height="82" rx="16"/><rect x="130" y="478" width="300" height="78" rx="16"/><rect x="570" y="478" width="300" height="78" rx="16"/><rect x="300" y="590" width="400" height="46" rx="16"/></g>
    <g fill="#182620"><text x="190" y="110" font-size="18" font-weight="700">当前 JointState</text><text x="190" y="135" font-size="14">起始关节状态</text><text x="500" y="110" font-size="18" font-weight="700">目标 Tool Pose</text><text x="500" y="135" font-size="14">位置 + 四元数</text><text x="810" y="110" font-size="18" font-weight="700">Scene</text><text x="810" y="135" font-size="14">障碍物与碰撞模型</text>
      <text x="500" y="244" font-size="20" font-weight="700" fill="#14795c">RobotConfig / Kinematics</text><text x="500" y="270" font-size="14">模型、限位、坐标系和碰撞球</text><text x="500" y="376" font-size="20" font-weight="700">候选 Seeds</text><text x="500" y="402" font-size="14">多初值并行探索</text><text x="280" y="510" font-size="18" font-weight="700">IK / 轨迹优化</text><text x="280" y="535" font-size="14">平滑度 · 限位 · 碰撞</text><text x="720" y="510" font-size="18" font-weight="700">Graph Planning</text><text x="720" y="535" font-size="14">直接优化失败时生成可行 seed</text><text x="500" y="620" font-size="18" font-weight="700" fill="#14795c">无碰撞、已插值的 JointState 轨迹</text></g>
    <g stroke="#23846b" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M190 154V186H410V204"/><path d="M500 154V204"/><path d="M810 154V186H590V204"/><path d="M500 292V336"/><path d="M500 424V451H280V472"/><path d="M500 451H720V472"/><path d="M280 556V572H470V584"/><path d="M720 556V572H530V584"/></g>
  </g>
</svg>
