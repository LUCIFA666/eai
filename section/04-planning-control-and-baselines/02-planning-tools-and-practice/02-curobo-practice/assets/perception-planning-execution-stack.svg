<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">具身系统分层职责</title><desc id="desc">感知与 VLM、任务层、cuRobo 运动层和执行层依次传递结构化信息。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#247d67"/></marker></defs><rect width="1000" height="650" rx="28" fill="#f5f9f7"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="500" y="45" font-size="25" font-weight="700" fill="#17251f">从任务理解到安全执行：四层各司其职</text><g stroke-width="2"><rect x="160" y="80" width="680" height="100" rx="20" fill="#eef2ff" stroke="#aebbe7"/><rect x="160" y="220" width="680" height="100" rx="20" fill="#fff7e8" stroke="#dfbb72"/><rect x="160" y="360" width="680" height="100" rx="20" fill="#e1f3ec" stroke="#77b39e"/><rect x="160" y="500" width="680" height="100" rx="20" fill="#f3edf9" stroke="#bca6d4"/></g><text x="290" y="121" font-size="20" font-weight="700">感知 / VLM</text><text x="600" y="116" font-size="15">Object Pose · Task Intent</text><text x="600" y="144" font-size="15">Timestamp · Confidence</text><text x="290" y="261" font-size="20" font-weight="700">任务层</text><text x="600" y="256" font-size="15">选择 Tool Frame</text><text x="600" y="284" font-size="15">生成 Pregrasp / Grasp / Retreat</text><text x="290" y="401" font-size="20" font-weight="700" fill="#14795c">cuRobo</text><text x="600" y="396" font-size="15">Reachability Filter</text><text x="600" y="424" font-size="15">Collision-Free Trajectory</text><text x="290" y="541" font-size="20" font-weight="700">执行层</text><text x="600" y="536" font-size="15">Limits · Controller · Watchdog</text><text x="600" y="564" font-size="15">Feedback · Fault Handling</text><g stroke="#247d67" stroke-width="3" marker-end="url(#a)"><path d="M500 180V214"/><path d="M500 320V354"/><path d="M500 460V494"/></g></g></svg>
