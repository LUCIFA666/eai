<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">轨迹控制点与插值采样</title><desc id="desc">稀疏优化控制点经过插值变成稠密固定周期轨迹点。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#257d67"/></marker></defs><rect width="1000" height="360" rx="26" fill="#f6faf8"/><g font-family="Arial,'Microsoft YaHei',sans-serif"><text x="500" y="45" text-anchor="middle" font-size="25" font-weight="700" fill="#17251f">从优化 Knot 到控制器 Waypoint</text><text x="75" y="115" font-size="17" font-weight="700">优化控制点</text><line x1="220" y1="110" x2="900" y2="110" stroke="#91aa9f" stroke-width="4"/><g fill="#168064" stroke="white" stroke-width="4"><circle cx="240" cy="110" r="13"/><circle cx="455" cy="110" r="13"/><circle cx="670" cy="110" r="13"/><circle cx="885" cy="110" r="13"/></g><g text-anchor="middle" font-size="15"><text x="240" y="82">q₀</text><text x="455" y="82">q₁</text><text x="670" y="82">q₂</text><text x="885" y="82">q₃</text></g><path d="M550 145V190" stroke="#257d67" stroke-width="3" marker-end="url(#a)"/><text x="575" y="174" font-size="15" fill="#52625c">插值 + 时间参数化</text><text x="75" y="260" font-size="17" font-weight="700">稠密轨迹点</text><line x1="220" y1="255" x2="900" y2="255" stroke="#91aa9f" stroke-width="4"/><g fill="#52aa8d"><circle cx="240" cy="255" r="9"/><circle cx="283" cy="255" r="7"/><circle cx="326" cy="255" r="7"/><circle cx="369" cy="255" r="7"/><circle cx="412" cy="255" r="7"/><circle cx="455" cy="255" r="9"/><circle cx="498" cy="255" r="7"/><circle cx="541" cy="255" r="7"/><circle cx="584" cy="255" r="7"/><circle cx="627" cy="255" r="7"/><circle cx="670" cy="255" r="9"/><circle cx="713" cy="255" r="7"/><circle cx="756" cy="255" r="7"/><circle cx="799" cy="255" r="7"/><circle cx="842" cy="255" r="7"/><circle cx="885" cy="255" r="9"/></g><text x="560" y="310" text-anchor="middle" font-size="15" fill="#52625c">固定周期 Δt，供控制器逐点消费</text></g></svg>
