<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
  <title id="title">多 seed 并行 IK</title><desc id="desc">同一目标位姿分发给多个初始种子并行优化，再筛选最佳有效解。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#247c67"/></marker></defs>
  <rect width="1040" height="500" rx="26" fill="#f6faf8"/><g font-family="Arial,'Microsoft YaHei',sans-serif" text-anchor="middle"><text x="520" y="44" font-size="25" font-weight="700" fill="#17251f">一个目标，多条并行 IK 搜索路径</text>
    <rect x="35" y="190" width="180" height="90" rx="18" fill="#e5f4ee" stroke="#82bba8" stroke-width="2"/><text x="125" y="225" font-size="19" font-weight="700">Target Pose</text><text x="125" y="253" font-size="14">同一末端目标</text>
    <g fill="#fff" stroke="#bfd8d0" stroke-width="2"><rect x="300" y="78" width="240" height="76" rx="15"/><rect x="300" y="174" width="240" height="76" rx="15"/><rect x="300" y="270" width="240" height="76" rx="15"/><rect x="300" y="366" width="240" height="76" rx="15"/></g>
    <g font-size="16" fill="#17251f"><text x="420" y="108" font-weight="700">Seed 1 → Optimization</text><text x="420" y="134" fill="#52635c">Candidate q₁</text><text x="420" y="204" font-weight="700">Seed 2 → Optimization</text><text x="420" y="230" fill="#52635c">Candidate q₂</text><text x="420" y="300" font-weight="700">Seed … → Optimization</text><text x="420" y="326" fill="#52635c">Candidate q…</text><text x="420" y="396" font-weight="700">Seed 32 → Optimization</text><text x="420" y="422" fill="#52635c">Candidate q₃₂</text></g>
    <rect x="640" y="150" width="220" height="170" rx="18" fill="#fff7e8" stroke="#e4bb6b" stroke-width="2"/><text x="750" y="190" font-size="18" font-weight="700">有效性筛选</text><text x="750" y="225" font-size="15">是否收敛</text><text x="750" y="253" font-size="15">关节限位</text><text x="750" y="281" font-size="15">碰撞约束</text>
    <rect x="900" y="190" width="110" height="90" rx="18" fill="#dff3eb" stroke="#5ca68d" stroke-width="2"/><text x="955" y="225" font-size="18" font-weight="700" fill="#14795c">Best</text><text x="955" y="252" font-size="16">valid q</text>
    <g stroke="#247c67" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M215 235H260V116H294"/><path d="M260 235V212H294"/><path d="M260 235V308H294"/><path d="M260 235V404H294"/><path d="M540 116H590V185H634"/><path d="M540 212H634"/><path d="M540 308H590V285H634"/><path d="M540 404H590V300H634"/><path d="M860 235H894"/></g>
  </g>
</svg>
