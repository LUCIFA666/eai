<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
    </marker>
    <style>
      .box{fill:#f7f7f7;stroke:#333;stroke-width:1.4;rx:12;}
      .title{font:700 17px sans-serif;fill:#111;}
      .text{font:14px sans-serif;fill:#333;}
      .small{font:12px sans-serif;fill:#555;}
      .arrow{stroke:#333;stroke-width:1.6;marker-end:url(#arrow);fill:none;}
    </style>
  </defs>
  <text x="30" y="35" class="title">SimplerEnv 最小运行链路</text>
  <rect x="30" y="70" width="190" height="90" class="box"/>
  <text x="50" y="100" class="title">simpler_env.make()</text>
  <text x="50" y="126" class="text">按任务名创建 Gym 环境</text>
  <text x="50" y="147" class="small">例如 google_robot_pick_coke_can</text>

  <rect x="270" y="70" width="200" height="90" class="box"/>
  <text x="290" y="100" class="title">ENVIRONMENT_MAP</text>
  <text x="290" y="126" class="text">任务名映射到 ManiSkill2</text>
  <text x="290" y="147" class="small">并设置 obs_mode=rgbd</text>

  <rect x="520" y="70" width="220" height="90" class="box"/>
  <text x="540" y="100" class="title">ManiSkill2_real2sim</text>
  <text x="540" y="126" class="text">机器人、场景、物体、控制器</text>
  <text x="540" y="147" class="small">Google Robot / WidowX 任务</text>

  <rect x="790" y="70" width="160" height="90" class="box"/>
  <text x="810" y="100" class="title">env.reset()</text>
  <text x="810" y="126" class="text">返回观测与 reset_info</text>
  <text x="810" y="147" class="small">image / agent / extra</text>

  <path d="M220 115 L270 115" class="arrow"/>
  <path d="M470 115 L520 115" class="arrow"/>
  <path d="M740 115 L790 115" class="arrow"/>

  <rect x="90" y="230" width="210" height="95" class="box"/>
  <text x="110" y="260" class="title">观测处理</text>
  <text x="110" y="286" class="text">get_image_from...</text>
  <text x="110" y="307" class="small">保存 PNG / MP4 证据</text>

  <rect x="385" y="230" width="210" height="95" class="box"/>
  <text x="405" y="260" class="title">动作输入</text>
  <text x="405" y="286" class="text">7 维连续动作</text>
  <text x="405" y="307" class="small">Δxyz / Δrot / gripper</text>

  <rect x="680" y="230" width="210" height="95" class="box"/>
  <text x="700" y="260" class="title">env.step(action)</text>
  <text x="700" y="286" class="text">推进仿真并返回 info</text>
  <text x="700" y="307" class="small">success / episode_stats</text>

  <path d="M870 160 C870 205, 790 220, 785 230" class="arrow"/>
  <path d="M680 278 L595 278" class="arrow"/>
  <path d="M385 278 L300 278" class="arrow"/>
</svg>
