<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">Domain randomization map</title>
  <desc id="desc">Domain randomization categories and where they are configured.</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", Inter, system-ui, sans-serif; }
      .bg { fill: #f6f3ed; }
      .ink { fill: #24312b; }
      .muted { fill: #66736c; }
      .card { fill: #ffffff; stroke: #c9d4ce; stroke-width: 1.5; rx: 12; }
      .hub { fill: #e4f3ef; stroke: #0b6f64; stroke-width: 2; rx: 16; }
      .line { stroke: #9caa9f; stroke-width: 2.5; fill: none; }
    </style>
  </defs>
  <rect class="bg" width="1080" height="390"/>
  <text class="ink" x="48" y="48" font-size="28" font-weight="800">域随机化：训练一族世界，而不是一个世界</text>

  <rect class="hub" x="414" y="142" width="252" height="96"/>
  <text class="ink" x="464" y="182" font-size="22" font-weight="800">Robust Policy</text>
  <text class="muted" x="456" y="210" font-size="14">对参数变化不敏感</text>

  <rect class="card" x="64" y="112" width="240" height="72"/>
  <text class="ink" x="88" y="142" font-size="17" font-weight="800">物理参数</text>
  <text class="muted" x="88" y="166" font-size="13">质量 / 摩擦 / 执行器增益</text>

  <rect class="card" x="64" y="224" width="240" height="72"/>
  <text class="ink" x="88" y="254" font-size="17" font-weight="800">初始状态</text>
  <text class="muted" x="88" y="278" font-size="13">姿态 / 目标 / 物体位置</text>

  <rect class="card" x="776" y="80" width="240" height="72"/>
  <text class="ink" x="800" y="110" font-size="17" font-weight="800">外部扰动</text>
  <text class="muted" x="800" y="134" font-size="13">推力 / 外力 / 间隔事件</text>

  <rect class="card" x="776" y="184" width="240" height="72"/>
  <text class="ink" x="800" y="214" font-size="17" font-weight="800">观测噪声</text>
  <text class="muted" x="800" y="238" font-size="13">ObsTerm.noise</text>

  <rect class="card" x="776" y="288" width="240" height="72"/>
  <text class="ink" x="800" y="318" font-size="17" font-weight="800">视觉外观</text>
  <text class="muted" x="800" y="342" font-size="13">光照 / 颜色 / 纹理 / 相机</text>

  <path class="line" d="M304 148 C350 148, 370 170, 414 178"/>
  <path class="line" d="M304 260 C350 260, 370 218, 414 204"/>
  <path class="line" d="M776 116 C720 124, 690 150, 666 174"/>
  <path class="line" d="M776 220 C724 220, 704 210, 666 204"/>
  <path class="line" d="M776 324 C720 300, 696 250, 666 222"/>

  <text class="muted" x="90" y="326" font-size="14">EventCfg: startup / reset / interval</text>
</svg>
