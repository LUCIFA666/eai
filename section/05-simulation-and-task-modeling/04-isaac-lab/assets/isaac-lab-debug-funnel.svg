<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400" role="img" aria-labelledby="title desc">
  <title id="title">Isaac Lab debugging funnel</title>
  <desc id="desc">Debugging order from task loop to PPO hyperparameters.</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", Inter, system-ui, sans-serif; }
      .bg { fill: #f6f3ed; }
      .ink { fill: #24312b; }
      .muted { fill: #66736c; }
      .bar { stroke-width: 1.5; rx: 10; }
    </style>
  </defs>
  <rect class="bg" width="1080" height="400"/>
  <text class="ink" x="48" y="48" font-size="28" font-weight="800">训练不涨时：从任务闭环往算法排查</text>

  <rect class="bar" x="120" y="112" width="840" height="44" fill="#e4f3ef" stroke="#0b6f64"/>
  <text class="ink" x="152" y="140" font-size="16" font-weight="800">1. 环境能 reset / step</text>
  <text class="muted" x="380" y="140" font-size="14">随机策略能跑，状态没有 NaN</text>

  <rect class="bar" x="170" y="166" width="740" height="44" fill="#eef5ee" stroke="#bfd0c2"/>
  <text class="ink" x="202" y="194" font-size="16" font-weight="800">2. observation 含目标</text>
  <text class="muted" x="430" y="194" font-size="14">策略看得到该往哪里做</text>

  <rect class="bar" x="220" y="220" width="640" height="44" fill="#fff6df" stroke="#b7791f"/>
  <text class="ink" x="252" y="248" font-size="16" font-weight="800">3. action 真的生效</text>
  <text class="muted" x="470" y="248" font-size="14">关节名、scale、actuator 对齐</text>

  <rect class="bar" x="270" y="274" width="540" height="44" fill="#e9f1fb" stroke="#33658a"/>
  <text class="ink" x="302" y="302" font-size="16" font-weight="800">4. reward 分项有变化</text>
  <text class="muted" x="532" y="302" font-size="14">符号、量级、分项曲线</text>

  <rect class="bar" x="320" y="328" width="440" height="44" fill="#f4eeee" stroke="#d6bfbd"/>
  <text class="ink" x="352" y="356" font-size="16" font-weight="800">5. 最后再调 PPO 超参</text>
  <text class="muted" x="584" y="356" font-size="14">lr / entropy / clip</text>
</svg>
