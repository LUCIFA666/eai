<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
  <title id="title">Isaac Lab distributed training topology</title>
  <desc id="desc">Multi GPU training with one process and environment batch per GPU.</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", Inter, system-ui, sans-serif; }
      .bg { fill: #f6f3ed; }
      .gpu { fill: #ffffff; stroke: #33658a; stroke-width: 2; rx: 14; }
      .sync { fill: #e4f3ef; stroke: #0b6f64; stroke-width: 2; rx: 18; }
      .ink { fill: #24312b; }
      .muted { fill: #66736c; }
      .line { stroke: #7f9187; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#7f9187"/>
    </marker>
  </defs>
  <rect class="bg" width="1080" height="390"/>
  <text class="ink" x="48" y="48" font-size="28" font-weight="800">多 GPU：每卡一批环境，梯度同步</text>

  <rect class="gpu" x="58" y="130" width="210" height="130"/>
  <text class="ink" x="106" y="166" font-size="20" font-weight="800">GPU 0</text>
  <text class="muted" x="88" y="196" font-size="14">rank 0 trainer</text>
  <text class="muted" x="88" y="220" font-size="14">2048 envs</text>

  <rect class="gpu" x="308" y="130" width="210" height="130"/>
  <text class="ink" x="356" y="166" font-size="20" font-weight="800">GPU 1</text>
  <text class="muted" x="338" y="196" font-size="14">rank 1 trainer</text>
  <text class="muted" x="338" y="220" font-size="14">2048 envs</text>

  <rect class="gpu" x="558" y="130" width="210" height="130"/>
  <text class="ink" x="606" y="166" font-size="20" font-weight="800">GPU 2</text>
  <text class="muted" x="588" y="196" font-size="14">rank 2 trainer</text>
  <text class="muted" x="588" y="220" font-size="14">2048 envs</text>

  <rect class="gpu" x="808" y="130" width="210" height="130"/>
  <text class="ink" x="856" y="166" font-size="20" font-weight="800">GPU 3</text>
  <text class="muted" x="838" y="196" font-size="14">rank 3 trainer</text>
  <text class="muted" x="838" y="220" font-size="14">2048 envs</text>

  <rect class="sync" x="350" y="304" width="380" height="56"/>
  <text class="ink" x="420" y="338" font-size="18" font-weight="800">NCCL AllReduce：同步梯度</text>

  <path class="line" d="M163 260 V304 H350"/>
  <path class="line" d="M413 260 V304 H430"/>
  <path class="line" d="M663 260 V304 H650"/>
  <path class="line" d="M913 260 V304 H730"/>

  <text class="muted" x="58" y="300" font-size="14">总环境数 = GPU 数 × 每卡 num_envs</text>
</svg>
