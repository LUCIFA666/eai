<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">xacro, URDF, and USD conversion pipeline</title>
  <desc id="desc">A diagram showing xacro templates becoming URDF, then being imported into Isaac Sim and saved as USD assets.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#27536b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1d2b33" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="960" height="360" fill="#f6f8f5"/>
  <text x="48" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#17252b">xacro -> URDF -> USD：机器人资产流水线</text>
  <text x="48" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#52616b">不要把导入当作终点：先生成，再导入，再体检，最后保存成可复用资产。</text>

  <g filter="url(#shadow)">
    <rect x="48" y="116" width="200" height="126" rx="8" fill="#ffffff" stroke="#9bb3bf"/>
    <rect x="286" y="116" width="200" height="126" rx="8" fill="#ffffff" stroke="#9bb3bf"/>
    <rect x="524" y="116" width="200" height="126" rx="8" fill="#ffffff" stroke="#9bb3bf"/>
    <rect x="762" y="116" width="150" height="126" rx="8" fill="#ffffff" stroke="#9bb3bf"/>
  </g>

  <text x="76" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#17394a">.urdf.xacro</text>
  <text x="76" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4a5961">模板源文件</text>
  <text x="76" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#60707a">宏、参数、include</text>
  <text x="76" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#60707a">左右臂前缀、hand=true</text>

  <text x="314" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#17394a">.urdf</text>
  <text x="314" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4a5961">展开后的机器人说明书</text>
  <text x="314" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#60707a">link、joint、mesh 路径</text>
  <text x="314" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#60707a">limit、惯量、碰撞体</text>

  <text x="552" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#17394a">Isaac Sim</text>
  <text x="552" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4a5961">URDF Importer</text>
  <text x="552" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#60707a">导入配置、joint drive</text>
  <text x="552" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#60707a">collider、articulation</text>

  <text x="790" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#17394a">.usd</text>
  <text x="790" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#4a5961">可复用资产</text>
  <text x="790" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#60707a">reference 到 stage</text>
  <text x="790" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#60707a">进入任务前先体检</text>

  <line x1="248" y1="178" x2="286" y2="178" stroke="#27536b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="486" y1="178" x2="524" y2="178" stroke="#27536b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="724" y1="178" x2="762" y2="178" stroke="#27536b" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="258" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#27536b">xacro CLI</text>
  <text x="496" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#27536b">导入</text>
  <text x="732" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#27536b">保存</text>

  <rect x="48" y="278" width="864" height="42" rx="8" fill="#e8f0ed" stroke="#b7c8c2"/>
  <text x="72" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2c4640">体检清单：mesh 路径、scale、材质、碰撞体、articulation root、joint drive、self-collision、USD 是否可重新引用。</text>
</svg>
