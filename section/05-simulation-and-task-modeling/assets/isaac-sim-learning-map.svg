<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">Isaac Sim learning map</title>
  <desc id="desc">A layered learning map for Isaac Sim: first understand GUI and Stage, then standalone loop, then sensors and data, then advanced topics.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8f5; }
      .band { fill: #ffffff; stroke: #d8ded8; stroke-width: 2; }
      .accent { fill: #e4f3ef; stroke: #0b6f64; stroke-width: 2; }
      .gold { fill: #fff6df; stroke: #b7791f; stroke-width: 2; }
      .blue { fill: #e9f1fb; stroke: #33658a; stroke-width: 2; }
      .ink { fill: #18201d; font-family: Segoe UI, Arial, sans-serif; }
      .muted { fill: #69736e; font-family: Segoe UI, Arial, sans-serif; }
      .title { font-size: 26px; font-weight: 800; }
      .label { font-size: 18px; font-weight: 800; }
      .small { font-size: 15px; }
      .num { font-size: 22px; font-weight: 800; fill: #0b6f64; }
      .line { stroke: #8aa39c; stroke-width: 2; fill: none; stroke-dasharray: 7 7; }
    </style>
  </defs>
  <rect class="bg" width="1040" height="560"/>
  <text class="ink title" x="44" y="56">Isaac Sim 5.1.0 新手学习地图</text>
  <text class="muted small" x="44" y="84">官方教程很多，不必线性读完；先围绕 standalone 闭环建立主干</text>

  <rect class="band" x="64" y="126" width="912" height="72" rx="8"/>
  <text class="num" x="94" y="170">1</text>
  <text class="ink label" x="134" y="158">GUI 与 Stage 直觉</text>
  <text class="muted small" x="134" y="181">导航、添加对象、查看 prim、理解场景树</text>

  <rect class="accent" x="64" y="222" width="912" height="72" rx="8"/>
  <text class="num" x="94" y="266">2</text>
  <text class="ink label" x="134" y="254">Python Standalone 主循环</text>
  <text class="muted small" x="134" y="277">SimulationApp、World、reset、step、controller</text>

  <rect class="gold" x="64" y="318" width="912" height="72" rx="8"/>
  <text class="num" x="94" y="362">3</text>
  <text class="ink label" x="134" y="350">观测、动作与数据</text>
  <text class="muted small" x="134" y="373">RGB/depth/state、action、episode、success、log</text>

  <rect class="blue" x="64" y="414" width="912" height="72" rx="8"/>
  <text class="num" x="94" y="458">4</text>
  <text class="ink label" x="134" y="446">专题能力层</text>
  <text class="muted small" x="134" y="469">Robot Setup、Sensors、Replicator、Motion Generation、ROS 2、Isaac Lab</text>

  <path class="line" d="M112 198 V222"/>
  <path class="line" d="M112 294 V318"/>
  <path class="line" d="M112 390 V414"/>

  <text class="muted small" x="64" y="524">建议顺序：先能看懂 standalone 脚本，再按任务需要补专题 API。</text>
</svg>
